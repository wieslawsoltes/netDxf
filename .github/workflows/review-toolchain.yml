name: Recover interrupted C# review patch
on:
  push:
    branches: [codex/review-toolchain-20260917]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover and fingerprint uploaded patch
        shell: python
        run: |
          import gzip, hashlib, json, pathlib
          source = pathlib.Path('.recovery/review.patch.gz').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
          assert blob == 'f8ad428238fd059a4cee453883621543256a6f47'
          data = gzip.decompress(source)
          output = pathlib.Path('recovered-review'); output.mkdir()
          (output / 'recovered.patch').write_bytes(data)
          (output / 'receipt.json').write_text(json.dumps({'blob': blob, 'compressed_sha256': hashlib.sha256(source).hexdigest(), 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}, indent=2) + '\n')
          print(data.decode('utf-8')[:8000])
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-csharp-review-patch
          path: recovered-review/
          retention-days: 7
