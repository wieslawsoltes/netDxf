name: Integrate supplemental clone qualification
on:
  push:
    branches: [codex/review-toolchain-20260917]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: supplemental
          ref: 5665a387d3fbc27087360e5951eeaa5ce9bc8242
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: implementation
          ref: f9261b741c1e8d5c5f51a6fdb6ecdaea1c6fc6fb
      - name: Preserve PR107 and materialize exact reviewed supplemental tree
        shell: python
        env:
          GIT_AUTHOR_NAME: Wiesław Šoltés
          GIT_AUTHOR_EMAIL: wieslawsoltes@users.noreply.github.com
          GIT_COMMITTER_NAME: Wiesław Šoltés
          GIT_COMMITTER_EMAIL: wieslawsoltes@users.noreply.github.com
        run: |
          import hashlib, json, pathlib, subprocess
          work = pathlib.Path('implementation').resolve()
          def git(*args): return subprocess.check_output(['git', *args], cwd=work).decode().strip()
          base = 'f9261b741c1e8d5c5f51a6fdb6ecdaea1c6fc6fb'
          expected = '554b13c8419e33c2d0e8b5a29f4cc453b7d4bb3d'
          branch = 'codex/review-qualified-clones-source-20260917'
          assert git('rev-parse', 'HEAD') == base
          assert git('rev-parse', 'HEAD^{tree}') == '664662aa92f0808c7cc3ca8a689980f6fdde3dec'
          assert not git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch)
          for source, target, digest in [
              ('tests/netDxf.Conformance/EntityCloneReviewTests.cs', 'tests/netDxf.Conformance/EntityCloneQualificationTests.cs', '8e2edf6db1be917bcb4830e8abf4e23c3dd91788cbc27ce202526501bacb5ba3'),
              ('tools/verify_entity_clone_review.py', 'tools/verify_entity_clone_qualification.py', '644e056849edb4b27b428422b9743b7291900703590973068bb6c61a6db8417c')]:
              text = (pathlib.Path('supplemental') / source).read_text()
              text = text.replace('CloneReview', 'CloneQualification').replace('EntityCloneReview', 'EntityCloneQualification').replace('clone-review', 'clone-qualification')
              data = text.encode()
              assert hashlib.sha256(data).hexdigest() == digest
              (work / target).write_bytes(data)
          program = work / 'tests/netDxf.Conformance/Program.cs'
          text = program.read_text()
          assert text.count('        RunAdditionalTests();') == 1
          program.write_text(text.replace('        RunAdditionalTests();', '        RegisterEntityCloneQualificationTests();\n        RunAdditionalTests();'))
          readme = work / 'README.md'
          readme.write_text(readme.read_text() + '\n[Supplementary entity clone qualification](doc/dxf-conformance/entity-clone-qualification.md) preserves the original clone-review cases and adds registered/nested source checks, exact leader directions, retained-source guards, and a separate all-profile pair corpus. No additional production cloning behavior is introduced by this qualification task.\n')
          (work / 'doc/dxf-conformance/entity-clone-qualification.md').write_bytes(pathlib.Path('transport/.recovery/clone/qualification.md').read_bytes())
          git('add', '-A')
          tree = git('write-tree'); assert tree == expected, 'Complete integrated source mismatch'
          sha = git('commit-tree', tree, '-p', base, '-m', 'test: retain PR107 and add independent nested clone qualification')
          git('push', 'origin', sha + ':refs/heads/' + branch)
          print(json.dumps({'commit': sha, 'tree': tree, 'base': base, 'branch': branch}))
