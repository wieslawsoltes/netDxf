name: Publish checksum-locked LINE affine review
on:
  push:
    branches: [codex/review-toolchain-20260917]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: implementation
          ref: cd2b4b2d0949eaa85ff517b438a1838f8fb25ffb
      - name: Verify complete source and publish clean child commit
        shell: python
        env:
          GIT_AUTHOR_NAME: Wiesław Šoltés
          GIT_AUTHOR_EMAIL: wieslawsoltes@users.noreply.github.com
          GIT_COMMITTER_NAME: Wiesław Šoltés
          GIT_COMMITTER_EMAIL: wieslawsoltes@users.noreply.github.com
        run: |
          import gzip, hashlib, json, pathlib, subprocess
          work = pathlib.Path('implementation').resolve()
          def git(*args, data=None): return subprocess.check_output(['git', *args], cwd=work, input=data).decode().strip()
          base = 'cd2b4b2d0949eaa85ff517b438a1838f8fb25ffb'
          expected = 'f8952b2b8442892ca05b93df316d6b179b6a337f'
          branch = 'codex/dxf-line-affine-review-20260917'
          assert git('rev-parse', 'HEAD') == base
          assert git('rev-parse', 'HEAD^{tree}') == '68dd970d70c3d79c8759aef02e4c9f492f2a8f06'
          assert not git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch), 'Destination already exists'
          packets = [
              (['production.patch.gz'], '47bb6f181b4b8f5e55c5d2c503ffb9525a97d7e4ad57f79547b241710cd4e858', '3a07ab470125623525ba7a013f2de3ca5c7b9e468d2cd1cff4bcecc46409f01d'),
              (['tests.patch.gz'], '0329996e439d2f06a0711a6c8c85cbcb6c436e2d1e837454c7d18e2c0da8e74b', 'cabbb1db99a41c0291e143be72aa2f84d897c1f0c645157256354954eacdcf10'),
              (['verifier.0', 'verifier.1'], '6c902327add501910a749a9a72021577c21c982b61e8f0cc1c5675f04bb2d96b', 'a3dbfea27aab2fc41618085f9ffa3792791e7a5b80b3b0639350839e113cefea'),
              (['docs.0', 'docs.1'], '1df144b13e96623f551b8e39f2dc2b91339e6b0cf00dc57bfeaa215a46ef480b', '6ab23bedbbed8d3f8c57d9f47bf11775d4f8f1d253bea71f48c989b9ef13265c'),
          ]
          for files, compressed_hash, patch_hash in packets:
              compressed = b''.join(pathlib.Path('transport/.recovery/line/' + name).read_bytes() for name in files)
              assert hashlib.sha256(compressed).hexdigest() == compressed_hash
              patch = gzip.decompress(compressed)
              assert hashlib.sha256(patch).hexdigest() == patch_hash
              git('apply', '--check', '-', data=patch)
              git('apply', '--whitespace=nowarn', '-', data=patch)
          git('add', '-A')
          tree = git('write-tree'); assert tree == expected, 'Reviewed LINE tree mismatch'
          sha = git('commit-tree', tree, '-p', base, '-m', 'fix: transform LINE signed extrusion atomically with exact endpoint arithmetic')
          git('push', 'origin', sha + ':refs/heads/' + branch)
          receipt = {'base': base, 'branch': branch, 'commit': sha, 'tree': tree, 'packets': packets}
          output = pathlib.Path('publication-receipt'); output.mkdir()
          (output / 'line-affine-review.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: line-affine-publication-receipt
          path: publication-receipt/
          retention-days: 14
