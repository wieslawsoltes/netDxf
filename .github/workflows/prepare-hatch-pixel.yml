name: Apply checked HATCH pixel-size support
on:
  push:
    branches: [feature/dxf-hatch-pixel-size]
    paths: [.github/workflows/prepare-hatch-pixel.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-hatch-pixel-size'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-hatch-pixel-size
      - name: Apply exact tested patch and verify source tree
        shell: python
        run: |
          from pathlib import Path
          import gzip, hashlib, os, subprocess
          payload = Path('.github/patches/hatch-pixel-size.gz')
          patch = gzip.decompress(payload.read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '12700399fbf341dde210b45b6d30fe5342802a8e88e733814220b8e4a023953e'
          path = Path(os.environ['RUNNER_TEMP']) / 'hatch-pixel.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          payload.unlink()
          workflow = Path('.github/workflows/prepare-hatch-pixel.yml'); workflow.unlink()
          paths = ['netDxf/Entities/Hatch.cs', 'netDxf/IO/DxfReader.cs', 'netDxf/IO/DxfWriter.cs', 'tests/netDxf.Conformance/RegressionTests.cs', 'tests/netDxf.Conformance/HatchPixelSizeTests.cs', 'tests/netDxf.Conformance/HatchPixelSizeApiTests.cs', 'tools/verify_hatch_pixel_size.py', 'doc/dxf-conformance/hatch-pixel-size.md']
          subprocess.run(['git', 'add', *paths, str(payload), str(workflow)], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '7775eeb63c5c7b4e3f03e2c0b7a5f0704517490d'
      - name: Commit only the isolated feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: retain optional HATCH pixel size through read write and clone'
          git push origin HEAD:feature/dxf-hatch-pixel-size
