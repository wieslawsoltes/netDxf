name: Apply reviewed double precision correction
on:
  push:
    branches: [fix/dxf-double-output]
    paths: [.github/workflows/prepare-double-output.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-double-output'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-double-output
      - name: Apply the reviewed formatter change and verify the final tree
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess
          p = Path('netDxf/IO/TextCodeValueWriter.cs')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '77a54d70b70d31624242f6b45f0e5426d73b95a7fbb75ac60cac599815eb628f'
          old = '            // float values always use the dot as the decimal separator\n            this.writer.WriteLine(value.ToString("0.0###############", CultureInfo.InvariantCulture));'
          new = '\n'.join([
              '            // G17 preserves all significant binary64 digits on every target, including',
              '            // .NET Framework where the R format has known round-trip limitations.',
              '            // Keep signed zero explicit even on runtimes whose formatter normalizes it.',
              '            string text = value == 0.0',
              '                ? (BitConverter.DoubleToInt64Bits(value) < 0 ? "-0.0" : "0.0")',
              '                : value.ToString("G17", CultureInfo.InvariantCulture);',
              "            if (text.IndexOf('.') < 0 && text.IndexOf('E') < 0 &&",
              '                !double.IsNaN(value) && !double.IsInfinity(value)) text += ".0";',
              '            this.writer.WriteLine(text);'])
          s = p.read_text(); assert s.count(old) == 1; p.write_text(s.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'e216f9a4ae8ce5cbaf41a7f3346ad4ebe6a93fce4facc89a4b53e1d09d1b4cd5'
          Path('.github/workflows/prepare-double-output.yml').unlink()
          subprocess.run(['git','add','netDxf/IO/TextCodeValueWriter.cs','.github/workflows/prepare-double-output.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '525307b06d19a9d8e334b999e43ed710c2b40329'
      - name: Commit only the reviewed feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: preserve full double precision in text DXF output'
          git push origin HEAD:fix/dxf-double-output
