name: Publish reviewed HATCH source
on:
  push:
    branches: [codex/dxf-hatch-graphics-20260924]
    paths: [.github/workflows/publish-hatch-graphics.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify and apply exact committed source without workflow edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '332e75a55b0c1fb2b718295b62d3f7a85b4b079e'
          test "$(git rev-parse 'HEAD^^{tree}')" = '750194be4b4e79e9a801f822e2226e1a7682e549'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma, os
          data = Path('tools/hatch-graphics-source.patch.xz').read_bytes()
          assert len(data) == 12116
          assert hashlib.sha256(data).hexdigest() == 'eeee61817fd8bf8753321c535fb5ae79fbb39f862394f14dcd1ea783701ecae2'
          patch = lzma.decompress(data, memlimit=268435456)
          assert len(patch) == 45762
          assert hashlib.sha256(patch).hexdigest() == '5f3973414f425ad592f11a6f83910d2e3b18afe9aec3fa548791a8d7ab28912d'
          Path(os.environ['RUNNER_TEMP'], 'hatch-graphics.diff').write_bytes(patch)
          PY
          git config core.autocrlf false
          git apply --check "$RUNNER_TEMP/hatch-graphics.diff"
          git apply --index "$RUNNER_TEMP/hatch-graphics.diff"
          test -z "$(git diff --cached -- .github/workflows)"
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/hatch-source.index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/hatch-source.index"
          git update-index --force-remove .github/workflows/publish-hatch-graphics.yml tools/hatch-graphics-source.patch.xz
          test "$(git write-tree)" = 'b438687ed37f589976842210b91f311e68e108a4'
          unset GIT_INDEX_FILE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Invalidate HATCH graphics on committed edits and reject projective transforms before mutation'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/codex/dxf-hatch-graphics-20260924
