name: Apply verified DIMBLK raw-name correction
on:
  push:
    branches: [fix/dxf-raw-dimstyle-code5]
    paths: [.github/workflows/prepare-dimblk.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-raw-dimstyle-code5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-raw-dimstyle-code5
      - name: Verify every patch byte and the complete reviewed tree
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, os, subprocess
          payload = Path('.github/patches/dimblk.gz')
          data = payload.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '251790a90681558573e5ebf864f318dc12074663'
          # Repair the recorded transfer omission; do not apply anything until canonical hashes match.
          encoded = base64.b64encode(data).decode()
          for old, new in [('ScoTrzGHYzF/OYgrv+EITS03', 'ScoTrzGHYzF/fOYgrv+EITS03'), ('fxUy22QVfAAA=', 'fxUy22QVfAAA')]:
              assert encoded.count(old) == 1
              encoded = encoded.replace(old, new)
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == '8152c25e459ed2f7333957c9d8053c1fd65a5707f99a9e1376734ba7479d0b12'
          patch_bytes = gzip.decompress(data)
          assert hashlib.sha256(patch_bytes).hexdigest() == 'b132baf56e24b104505f2855d1e45654fe148934f1fb3d9bd21083ba0889e2d3'
          patch = Path(os.environ['RUNNER_TEMP']) / 'dimblk.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          payload.unlink()
          Path('.github/workflows/prepare-dimblk.yml').unlink()
          paths = ['doc/dxf-conformance/dimstyle-arrow-names.md', 'netDxf/IO/BinaryCodeValueReader.cs', 'netDxf/IO/DxfGroupCode.cs', 'netDxf/IO/DxfRawDocument.cs', 'netDxf/IO/DxfRawTagContext.cs', 'netDxf/IO/DxfTag.cs', 'netDxf/IO/ICodeValueReader.cs', 'netDxf/IO/TextCodeValueReader.cs', 'tests/netDxf.Conformance/RawDimensionStyleNameTests.cs', 'tests/netDxf.Conformance/RegressionTests.cs', 'tools/verify_dimstyle_arrow_names.py', '.github/patches/dimblk.gz', '.github/workflows/prepare-dimblk.yml']
          subprocess.run(['git', 'add', *paths], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '845a84714636092485303fca87f3db0ec247c092'
      - name: Commit only the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: preserve DIMSTYLE group 5 arrow names in raw DXF'
          git push origin HEAD:fix/dxf-raw-dimstyle-code5
