name: Prepare verified raw handle operations
on:
  push:
    branches: [conformance/remap-20260914]
    paths: [.github/workflows/dxf-prepare-remap.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conformance/remap-20260914
          fetch-depth: 0
      - name: Restore exact tested patch
        env:
          GH_TOKEN: ${{ github.token }}
          ENCODED_LENGTH: '14048'
          PATCH_SHA256: 'd5d9c29c2418e41c9c32a8bace222ff58950bb264deba5780b66a206c507a903'
          ROW_OVERRIDES: >-
            {"33":"hoTkT68SNMHfvw06MVBx0mmfAbwBdlbTVR3Uav8EwpyFHeorDukOluBazQ7TP2sYumJfIQTl7qHyWtWkR8z/AUPj2WbvXH+E3jHt8OzLbi/7ZHgdcEzqEFGkwNfcAt5n"}
        run: |
          set -euo pipefail
          export BLOB_JSON="$RUNNER_TEMP/patch-blob.json"
          gh api repos/wieslawsoltes/netDxf/git/blobs/bad980ddc12066b91ba6eb717fc1687e2e1d276c > "$BLOB_JSON"
          python .github/dxf-transfer.py
      - name: Verify tree and publish isolated feature
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 2115ad288c59abb0822255c97b64720f9c5880bb
          git rm .github/dxf-transfer.py .github/workflows/dxf-prepare-remap.yml
          test "$(git write-tree)" = 393df6ce7999f6326a35f101d8cbba495806f029
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: traverse raw references and remap handles simultaneously'
          git push origin HEAD:conformance/remap-20260914
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: remap-transfer-diagnostic
          path: ${{ runner.temp }}/staged-envelope.txt
          retention-days: 2
