name: Temporary CAD native verification
on:
  push:
    branches: [workbench/cad-block-authoring]
    paths: ['.github/workflows/cad-feature-staging.yml']
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/workbench/cad-block-authoring'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "NUGET_PACKAGES=$RUNNER_TEMP/cad-nuget" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Select the installed .NET 8 SDK for this temporary checkout
        shell: bash
        run: |
          sdk="$(dotnet --list-sdks | awk '/^8\./ {print $1}' | sort -V | tail -1)"
          test -n "$sdk"
          dotnet new globaljson --sdk-version "$sdk" --roll-forward latestPatch
          dotnet --version
      - name: Recover verified official SDK and project dependencies
        run: python tools/ci/cad_stage.py tooling
      - name: Verify native block authoring
        run: dotnet run --project shadow/tests/netDxf.Shadow.AdvancedVerification/netDxf.Shadow.AdvancedVerification.csproj -c Release -p:TargetFrameworks=net8.0 -p:NoWarn=1591
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cad-native-sdk
          path: |
            ${{ runner.temp }}/cad-build-tools/sdk.tar.gz
            ${{ runner.temp }}/cad-build-tools/manifest.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cad-native-dependencies
          path: |
            ${{ runner.temp }}/cad-build-tools/nuget.tar.gz
            ${{ runner.temp }}/cad-build-tools/manifest.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cad-native-workbench-tests
          path: artifacts/
          retention-days: 1
          if-no-files-found: ignore
