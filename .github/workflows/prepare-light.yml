name: Prepare typed LIGHT
on:
  push:
    branches: [feat/typed-light-20260914]
    paths: [.github/workflows/prepare-light.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typed-light-20260914
          fetch-depth: 0
      - name: Apply exact integration edits and verify tested source
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 683e035e54cc8a51360830da81133062ddd9559e
          python .github/prepare_light.py
          git rm .github/prepare_light.py .github/workflows/prepare-light.yml
          git add -A
          test "$(git write-tree)" = 2bd54e1e439cec171f88b760884ab29031de5542
          git -c core.whitespace=cr-at-eol diff --cached --check
          python tools/generate_dxf_coverage.py --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: support typed distant point and spot LIGHT entities'
          git push origin HEAD:feat/typed-light-20260914
