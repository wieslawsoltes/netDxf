name: Publish reviewed release-gate corrections
on:
  push:
    branches: [codex/dxf-ci-release-20260922]
    paths: [.github/workflows/publish-ci-review.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact reviewed patch and remove publication files
        shell: bash
        run: |
          echo 'e575d15c62a73c8b2e738124a234867754c9318808b841632d50896242ce89ca  tools/ci/_review.patch' | sha256sum --check
          git apply --check tools/ci/_review.patch
          git apply tools/ci/_review.patch
          rm tools/ci/_review.patch .github/workflows/publish-ci-review.yml
          git add .github/workflows tools/ci tests/ci_pipeline doc/CI-RELEASE.md
          test "$(git write-tree)" = '5cc788f9d58cec3aad13bb1f06ee77356e949c39'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Exercise release qualification on pipeline PRs and validate complete tagged receipts'
          git push origin HEAD:refs/heads/codex/dxf-ci-release-20260922
