name: Prepare non-consuming DXF header probe
on:
  push:
    branches: [feature/dxf-header-probe]
    paths: [.github/workflows/dxf-prepare-header-probe.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-header-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Integrate tested probe and remove preparation workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('netDxf/IO/DxfReader.cs')
          s = p.read_text()
          a = s.index('        private static bool IsBinary(Stream stream)\n')
          b = s.index('        #endregion\n', a)
          p.write_text(s[:a] + s[b:])
          p = Path('netDxf/DxfDocument.cs')
          s = p.read_bytes().decode().replace('\r\n', '\n')
          old = '        /// <returns>String that represents the DXF file version.</returns>'
          assert s.count(old) == 4
          s = s.replace(old, '        /// <returns>The declared DXF database version, or Unknown when it cannot be determined.</returns>')
          old = '        /// <remarks>The caller will be responsible of closing the stream.</remarks>\n        public static DxfVersion CheckDxfFileVersion'
          new = '''        /// <remarks>
                  /// Requires readable, seekable input. The caller owns the stream.
                  /// The entry position is restored after successful probing or a parsing failure.
                  /// This reads the declared version; it does not validate the remainder of the document.
                  /// </remarks>
                  public static DxfVersion CheckDxfFileVersion'''
          assert s.count(old) == 2
          s = s.replace(old, new)
          p.write_bytes(s.replace('\n', '\r\n').encode())
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          s = p.read_text()
          old = '        RegisterMinimalDocumentTests();\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + '        RegisterHeaderProbeTests();\n'))
          expected = {
              'netDxf/DxfDocument.cs': '175c0bcd7212c474ba3dae41e57b8694b5572ae821823d5dff74ffbba8a1156a',
              'netDxf/IO/DxfReader.cs': '0b96e052b0dcc635105409b5abb1a80833f0fc24dba9324b3379e322a7cee6dd',
              'netDxf/IO/DxfReader.HeaderProbe.cs': 'fdddd5227904cf5502ba23481af499e479ebabede9857cd6005024afa33e7f8e',
              'tests/netDxf.Conformance/HeaderProbeTests.cs': 'd3033cb3bfa7922f749f6945e9428a2d562d11b3c312ef74fa5842d56eb90b2b',
              'tests/netDxf.Conformance/RegressionTests.cs': 'd76f59ae0e73bb98546e137eeef14736b12f4f8f23f8819211640151cf74f81e'
          }
          for path, digest in expected.items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Tested-source hash mismatch: ' + path)
          Path('.github/workflows/dxf-prepare-header-probe.yml').unlink()
          PY
          git add netDxf/IO/DxfReader.cs netDxf/DxfDocument.cs tests/netDxf.Conformance/RegressionTests.cs .github/workflows/dxf-prepare-header-probe.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore header probe position and honor typed section boundaries'
          git push origin HEAD:feature/dxf-header-probe
