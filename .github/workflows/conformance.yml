name: DXF conformance

on:
  pull_request:
  push:
    branches: [netstandard]

permissions:
  contents: read

concurrency:
  group: dxf-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build all existing library targets
        if: matrix.os == 'windows-latest' && matrix.configuration == 'Release'
        run: dotnet build netDxf/netDxf.csproj -c Release --nologo
      - name: Prepare artifacts directory
        shell: bash
        run: mkdir -p artifacts
      - name: Run conformance and regression tests
        run: dotnet run --project tests/netDxf.Tests/netDxf.Tests.csproj -c ${{ matrix.configuration }} -- -xml artifacts/test-results.xml
      - name: Archive exact source under test
        if: always() && matrix.os == 'ubuntu-latest' && matrix.configuration == 'Release'
        run: git archive --format=zip -o artifacts/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.os }}-${{ matrix.configuration }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
