name: Prepare corrected C# integration fixtures
on:
  push:
    branches: [codex/csharp-merge-materialization-20260917]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: implementation
          ref: cdd3f467ea763502641e24ba4121b3a9e31efcf3
          fetch-depth: 0
      - name: Retain setter rejection and original malformed-transform assertions
        shell: python
        env:
          GIT_AUTHOR_NAME: Wiesław Šoltés
          GIT_AUTHOR_EMAIL: wieslawsoltes@users.noreply.github.com
          GIT_COMMITTER_NAME: Wiesław Šoltés
          GIT_COMMITTER_EMAIL: wieslawsoltes@users.noreply.github.com
        run: |
          import json, pathlib, subprocess
          work = pathlib.Path('implementation').resolve()
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=work).decode().strip()
          original111 = 'cdd3f467ea763502641e24ba4121b3a9e31efcf3'
          original112 = '9d96d024e6f592753873c7a0c207435791b17379'
          assert git('rev-parse', 'HEAD') == original111
          assert git('rev-parse', 'HEAD^{tree}') == '5715b155e43bbde23b7ff80c0c39a7a08419e6dc'
          path = work / 'tests/netDxf.Conformance/LineAffineReviewTests.cs'
          assert git('hash-object', str(path)) == '58d5d8aadde87f61fb191295387df9ca3130f712'
          old = b'else {var p=Vector3.UnitZ;p[i-7]=bad;line.Normal=p;}'
          new = b'else {var p=Vector3.UnitZ;p[i-7]=bad;LineReviewInjectInvalidNormal(line,p);}'
          data = path.read_bytes(); assert data.count(old) == 1
          path.write_bytes(data.replace(old, new, 1))
          helper = work / 'tests/netDxf.Conformance/LineNormalIntegrationTests.cs'
          assert not helper.exists()
          helper.write_bytes(pathlib.Path('transport/.merge-helper/LineNormalIntegrationTests.cs').read_bytes())
          git('add', '--', 'tests/netDxf.Conformance/LineAffineReviewTests.cs', 'tests/netDxf.Conformance/LineNormalIntegrationTests.cs')
          tree111 = git('write-tree'); assert tree111 == '3a91f580cf94dc19a51d206cba019328f0b59978'
          fixed111 = git('commit-tree', tree111, '-p', original111, '-m', 'test: preserve LINE malformed-normal transform guards after atomic setter integration')
          git('reset', '--hard', original112)
          git('merge', '--no-commit', '--no-ff', fixed111)
          tree112 = git('write-tree'); assert tree112 == '6c17b36eae19af8ab6d1dffd0fdea1a38c45af0c'
          git('merge', '--quit')
          fixed112 = git('commit-tree', tree112, '-p', original112, '-p', fixed111, '-m', 'merge: retain corrected LINE integration fixtures in full C# audit stack')
          refs = []
          results = []
          for number, head, tree in [(111, fixed111, tree111), (112, fixed112, tree112)]:
              branch = 'codex/csharp-merge-fixed-' + str(number) + '-20260917'
              assert not git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch)
              refs.append(head + ':refs/heads/' + branch)
              results.append({'pr': number, 'head': head, 'tree': tree, 'branch': branch})
          git('push', '--atomic', 'origin', *refs)
          output = pathlib.Path('merge-receipt'); output.mkdir()
          (output / 'fixed-merges.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-csharp-integration-fixtures
          path: merge-receipt/
          retention-days: 14
