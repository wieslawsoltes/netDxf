name: Prepare verified C# audit merges
on:
  push:
    branches: [codex/csharp-merge-materialization-20260917]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aff3b24ae1936308063d9d7fb6e3fd4dcb16516e
          fetch-depth: 0
      - name: Reproduce pinned local integration trees without rewriting PR history
        shell: python
        env:
          GIT_AUTHOR_NAME: Wiesław Šoltés
          GIT_AUTHOR_EMAIL: wieslawsoltes@users.noreply.github.com
          GIT_COMMITTER_NAME: Wiesław Šoltés
          GIT_COMMITTER_EMAIL: wieslawsoltes@users.noreply.github.com
        run: |
          import json, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          base = 'aff3b24ae1936308063d9d7fb6e3fd4dcb16516e'
          assert git('rev-parse', 'HEAD') == base
          assert git('rev-parse', 'HEAD^{tree}') == '6838a388ff3f924de3a677738d162db912a03221'
          stages = [
              (110, '43f2458f2452a997ab97da0c6ee9a0967b7a8e7f', 'cf1fde10ff77f40d0cb9aa3866a52fd09157ceb5'),
              (111, '090d345db23094201a1bca07b0af88453b0320e1', '5715b155e43bbde23b7ff80c0c39a7a08419e6dc'),
              (112, '077919cfc075e70ebb6b58b078fc9ac8f85ce8a5', '259bb7d5a06ddabefd7bf74265c52c683832afcf'),
          ]
          previous = base
          results = []
          for number, original, expected in stages:
              branch = 'codex/csharp-merge-prepared-' + str(number) + '-20260917'
              assert not git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch), 'Prepared branch already exists'
              git('checkout', '--detach', previous)
              result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', original])
              conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
              if result.returncode:
                  assert result.returncode == 1 and conflicts == ['README.md'], conflicts
                  path = pathlib.Path('README.md')
                  data, count = re.subn(rb'^<<<<<<< [^\n]*\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n',
                      lambda match: match.group(1) + b'\n' + match.group(2), path.read_bytes(), flags=re.M | re.S)
                  assert count == 1
                  assert not re.search(rb'^(<<<<<<<|=======|>>>>>>>)', data, re.M)
                  path.write_bytes(data)
                  git('add', 'README.md')
              else:
                  assert not conflicts
              tree = git('write-tree')
              assert tree == expected, (number, tree, expected)
              git('-c', 'core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol', 'diff', '--cached', '--check')
              git('merge', '--quit')
              commit = git('commit-tree', tree, '-p', original, '-p', previous, '-m',
                  'merge: integrate preceding C# audits into PR #' + str(number) + ' without dropping source or tests')
              results.append({'pr': number, 'original_head': original, 'integrated_base': previous, 'head': commit, 'tree': tree, 'branch': branch})
              previous = commit
          refs = [row['head'] + ':refs/heads/' + row['branch'] for row in results]
          git('push', '--atomic', 'origin', *refs)
          output = pathlib.Path('merge-receipt'); output.mkdir()
          (output / 'prepared-merges.json').write_text(json.dumps({'base': base, 'merges': results}, indent=2) + '\n')
          git('archive', '--format=tar.gz', '--output=merge-receipt/source.tar.gz', previous)
          print(json.dumps(results, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-csharp-audit-merges
          path: merge-receipt/
          retention-days: 14
