name: Build and package
on:
  push:
    branches: [netstandard, 'codex/dxf-*']
  pull_request:
    branches: [netstandard]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Validated package version (empty creates an unpublished CI prerelease)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: build-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: Build all targets (${{ matrix.os }}, ${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release tooling
        run: python -m unittest discover -s tests/ci_pipeline -p 'test_*.py'
      - name: Restore and build all five library targets
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          mkdir -p artifacts/build
          dotnet restore netDxf/netDxf.csproj
          dotnet build netDxf/netDxf.csproj --no-restore -c "$CONFIGURATION" -p:ContinuousIntegrationBuild=true -bl:artifacts/build/build.binlog
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.configuration }}
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve source and package version
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python tools/ci/pipeline.py metadata --version "$REQUESTED_VERSION"
      - name: Build packages with portable symbols
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: >-
          dotnet pack netDxf/netDxf.csproj -c Release -o artifacts/packages
          -p:PackageVersion="$VERSION" -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl=https://github.com/wieslawsoltes/netDxf -p:RepositoryCommit="$COMMIT"
          -p:PackageProjectUrl=https://github.com/wieslawsoltes/netDxf -p:RepositoryType=git
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:DebugType=portable -p:DebugSymbols=true
      - name: Consume only the freshly produced package
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          NUGET_PACKAGES: ${{ runner.temp }}/netdxf-smoke-packages
        run: |
          dotnet restore tests/netDxf.PackageSmoke --source "$PWD/artifacts/packages" -p:PackageVersion="$VERSION" -p:NuGetAudit=false
          dotnet run --project tests/netDxf.PackageSmoke --no-restore -c Release -p:PackageVersion="$VERSION" | tee artifacts/packages/smoke.log
      - name: Inspect all assets, source identity, documentation and symbols
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: python tools/ci/pipeline.py package --version "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
