name: Build, test and package
on:
  merge_group:
    types: [checks_requested]
    branches: [netstandard]
  push:
    branches: [netstandard]
  pull_request:
    branches: [netstandard]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Validated package version (empty creates an unpublished CI prerelease)
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: build-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
jobs:
  shadow:
    name: Shadow DOM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build shadow libraries and integrated Studio
        run: dotnet build shadow/samples/netDxf.Shadow.Studio/netDxf.Shadow.Studio.csproj -c Release -p:TargetFrameworks=net8.0 -p:NoWarn=1591
      - name: Verify snapshot, synchronization, geometry, graph and editor contracts
        run: dotnet run --project shadow/tests/netDxf.Shadow.Verification/netDxf.Shadow.Verification.csproj -c Release -p:TargetFrameworks=net8.0 -p:NoWarn=1591
      - name: Verify structural history, incremental processing, appearance and rich text
        run: dotnet run --project shadow/tests/netDxf.Shadow.AdvancedVerification/netDxf.Shadow.AdvancedVerification.csproj -c Release -p:TargetFrameworks=net8.0 -p:NoWarn=1591
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Studio HTTP and SSE contracts
        run: python shadow/tests/http_contract.py
      - name: Verify browser state receipt ordering
        run: node --test shadow/tests/browser/state.test.mjs
      - name: Retain rendered regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-verification-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
  build:
    name: Build all targets (${{ matrix.os }}, ${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release tooling
        run: python -m unittest discover -s tests/ci_pipeline -p 'test_*.py'
      - name: Restore and build all five library targets
        shell: bash
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          mkdir -p artifacts/build
          dotnet restore netDxf/netDxf.csproj
          dotnet build netDxf/netDxf.csproj --no-restore -c "$CONFIGURATION" -p:ContinuousIntegrationBuild=true -bl:artifacts/build/build.binlog
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.configuration }}
          path: artifacts/build/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve source and package version
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python tools/ci/pipeline.py metadata --version "$REQUESTED_VERSION"
      - name: Build packages with portable symbols
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: >-
          dotnet pack netDxf/netDxf.csproj -c Release -o artifacts/packages
          -p:PackageVersion="$VERSION" -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl=https://github.com/wieslawsoltes/netDxf -p:RepositoryCommit="$COMMIT"
          -p:PackageProjectUrl=https://github.com/wieslawsoltes/netDxf -p:RepositoryType=git
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:DebugType=portable -p:DebugSymbols=true
      - name: Consume only the freshly produced package
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          NUGET_PACKAGES: ${{ runner.temp }}/netdxf-smoke-packages
        run: |
          dotnet restore tests/netDxf.PackageSmoke --source "$PWD/artifacts/packages" -p:PackageVersion="$VERSION" -p:NuGetAudit=false
          dotnet run --project tests/netDxf.PackageSmoke --no-restore -c Release -p:PackageVersion="$VERSION" | tee artifacts/packages/smoke.log
      - name: Inspect all assets, source identity, documentation and symbols
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: python tools/ci/pipeline.py package --version "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
  runtime-smoke:
    name: Execute package (${{ matrix.os }}, ${{ matrix.asset }} on ${{ matrix.runtime }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Package target/runtime matrix begins
          - {"os": "ubuntu-latest", "runtime": "net8.0", "asset": "netstandard2.0"}
          - {"os": "ubuntu-latest", "runtime": "net6.0", "asset": "net6.0"}
          - {"os": "ubuntu-latest", "runtime": "net8.0", "asset": "net8.0"}
          - {"os": "windows-latest", "runtime": "net8.0", "asset": "netstandard2.0"}
          - {"os": "windows-latest", "runtime": "net6.0", "asset": "net6.0"}
          - {"os": "windows-latest", "runtime": "net8.0", "asset": "net8.0"}
          - {"os": "windows-latest", "runtime": "net471", "asset": "net471"}
          - {"os": "windows-latest", "runtime": "net48", "asset": "net48"}
          # Package target/runtime matrix ends
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.runtime == 'net6.0'
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: artifacts/packages/
      - name: Execute shared assertions against the exact installed asset
        env:
          SMOKE_HOST: ${{ matrix.os }}
          SMOKE_RUNTIME: ${{ matrix.runtime }}
          SMOKE_ASSET: ${{ matrix.asset }}
        shell: bash
        run: python tools/ci/runtime_assets.py run --host "$SMOKE_HOST" --runtime "$SMOKE_RUNTIME" --asset "$SMOKE_ASSET"
      - name: Retain runtime identity, process log and loaded-assembly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-smoke-${{ matrix.os }}-${{ matrix.asset }}
          path: |
            artifacts/target-smoke/*/result.json
            artifacts/target-smoke/*/receipt.xml
            artifacts/target-smoke/*/run.log
          if-no-files-found: error
          retention-days: 14
  runtime-evidence:
    name: Require complete package runtime matrix
    needs: runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-smoke-*
          path: artifacts/runtime-reports/
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: artifacts/packages/
      - name: Reject missing, duplicate, changed or wrong-source runtime evidence
        run: |
          python tools/ci/runtime_assets.py collect
          python tools/ci/runtime_release.py capture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-qualification
          path: artifacts/runtime-qualified/
          if-no-files-found: error
          retention-days: 30

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DXF_TEST_FILTER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install independent checker dependencies
        run: python -m pip install -r tools/requirements-independent.txt
      - name: Check coverage ledger and generated comparison
        run: |
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p "test_*.py"
          python -m unittest discover -s tests/standard_fields -p "test_*.py"
          python -m unittest discover -s tests/field_hosts -p "test_*.py"
      - name: Run version and format regression tests
        run: dotnet run --project tests/netDxf.Conformance/netDxf.Conformance.csproj --configuration ${{ matrix.configuration }}
      - name: Build netstandard API target
        run: dotnet build netDxf/netDxf.csproj --configuration ${{ matrix.configuration }} --framework netstandard2.0 --no-restore
      - name: Verify exported fixtures with an independent DXF reader
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: python tools/run_independent_verifiers.py artifacts/conformance
      - name: Collect source-level audit evidence
        if: runner.os == 'Linux' && matrix.configuration == 'Debug'
        run: |
          python3 tools/dxf_audit_inventory.py > artifacts/inventory.json
          dotnet run --project tools/netDxf.FieldAudit -- --self-test
          dotnet run --project tools/netDxf.FieldAudit -- . artifacts/field-audit
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
      - name: Bind reports to the tested source
        if: always()
        run: python tools/ci/pipeline.py provenance --directory artifacts
      - name: Retain fixtures, results, and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dxf-conformance-${{ matrix.os }}-${{ matrix.configuration }}
          path: artifacts/
          retention-days: 14

  qualify:
    needs: [conformance, runtime-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: artifacts/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dxf-conformance-*
          path: artifacts/release-tests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-qualification
          path: artifacts/release-runtime
      - name: Verify checksums and require complete source-bound test reports
        run: python tools/ci/pipeline.py qualify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-release
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30

  prepare-public-source-blobs:
    # Temporary transport only: creates two hash-verified source blobs, never commits or moves refs.
    # Removed before feature qualification; existing test/release jobs remain mandatory.
    if: github.event_name == 'pull_request' && github.repository == 'wieslawsoltes/netDxf' && github.event.pull_request.number == 244 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/shadow-complex-linetypes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Store only two exact public source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          edits = [
              ('netDxf/IO/DxfReader.cs', '96dcc6ff3c6861d9ea9b3ce334d8b501e061d61e', 'a701bd0c488d504d7607e64c1525e7f1d65c8863', 37874, 39148,
               ''),
              ('netDxf/IO/DxfWriter.cs', '21b165cf7f95d09e28529f10fa26b5da89422a85', '0fd082ab8268578482daaeae2b7eb054c93859d2', 66059, 66059,
               'aGFwZU51bWJlciA/PyBzaGFwZVNlZ21lbnQuUw=='),
          ]
          for path, expected_base, expected_result, start, end, encoded in edits:
              original = pathlib.Path(path).read_bytes()
              if blob(original) != expected_base:
                  raise RuntimeError('Unexpected source identity: ' + path)
              result = original[:start] + base64.b64decode(encoded, validate=True) + original[end:]
              if blob(result) != expected_result:
                  raise RuntimeError('Unexpected result identity: ' + path)
              request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/netDxf/git/blobs',
                  data=json.dumps({'encoding': 'utf-8', 'content': result.decode('utf-8')}).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=45) as response:
                  stored = json.load(response)['sha']
              if stored != expected_result:
                  raise RuntimeError('Stored source identity mismatch: ' + path)
              print(path, stored, flush=True)
          PY
