name: Prepare thumbnail integration
on:
  push:
    branches: [codex/dxf-thumbnail-preservation]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/dxf-thumbnail-preservation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dxf-thumbnail-preservation
      - name: Apply explicit document and section integration edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('netDxf/DxfDocument.cs')
          s = p.read_bytes()
          old = b'        private long numHandles;'
          assert s.count(old) == 1
          s = s.replace(old, old + b'\r\n        private byte[] thumbnailImage = new byte[0];')
          old = b'        #region public properties\r\n'
          prop = '''
                  /// <summary>
                  /// Gets or sets the opaque preview bytes stored in the DXF THUMBNAILIMAGE section.
                  /// </summary>
                  /// <remarks>
                  /// The default is an empty array. Assign an empty array to remove the preview.
                  /// Input and output arrays are copied; changing an array does not change the document.
                  /// These bytes are preserved without decoding or regenerating an image. Editing
                  /// drawing entities does not refresh the preview; callers should replace or clear it.
                  /// An empty preview section is normalized to an absent section when saving.
                  /// </remarks>
                  /// <exception cref="ArgumentNullException">The assigned value is null.</exception>
                  public byte[] ThumbnailImage
                  {
                      get { return (byte[]) this.thumbnailImage.Clone(); }
                      set
                      {
                          if (value == null)
                          {
                              throw new ArgumentNullException(nameof(value));
                          }
                          this.thumbnailImage = (byte[]) value.Clone();
                      }
                  }
          '''
          # Strip the ten additional spaces used to align this YAML-embedded source.
          prop = '\n'.join(line[10:] if line.startswith('          ') else line for line in prop.split('\n'))
          assert s.count(old) == 1
          s = s.replace(old, old + prop.replace('\n', '\r\n').encode())
          p.write_bytes(s)
          p = Path('netDxf/IO/DxfReader.cs')
          s = p.read_text()
          start = s.index('        private void ReadThumbnailImage()')
          end = s.index('        private void ReadAcdsData()', start)
          s = s[:start] + '        private void ReadThumbnailImage()\n        {\n            Debug.Assert(this.chunk.ReadString() == DxfObjectCode.ThumbnailImageSection);\n            this.doc.ThumbnailImage = DxfThumbnailImage.Read(this.chunk);\n        }\n\n' + s[end:]
          p.write_text(s)
          p = Path('netDxf/IO/DxfWriter.cs')
          s = p.read_text()
          old = '            this.EndSection(); //End section objects\n\n            this.Close();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '            this.EndSection(); //End section objects\n\n            DxfThumbnailImage.Write(this.chunk, this.doc.ThumbnailImage);\n            this.Close();'))
          p = Path('tests/netDxf.Conformance/Program.cs')
          s = p.read_text()
          old = '        RunTableXDataTests();'
          assert s.count(old) == 1 and 'RunThumbnailImageTests();' not in s
          p.write_text(s.replace(old, old + '\n        RunThumbnailImageTests();'))
          PY
          git -c core.whitespace=cr-at-eol diff --check
          git rm .github/workflows/dxf-thumbnail-prepare.yml
          git add netDxf/DxfDocument.cs netDxf/IO/DxfReader.cs netDxf/IO/DxfWriter.cs tests/netDxf.Conformance/Program.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: preserve DXF thumbnail bytes through document load and save'
          git push origin HEAD:refs/heads/codex/dxf-thumbnail-preservation
# Branch-only preparation deletes itself and is excluded from the final PR diff.
