name: Apply reviewed DXF coverage ledger
on:
  push:
    branches: [audit/dxf-current-version-matrix]
    paths: [.github/workflows/prepare-coverage-ledger.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/audit/dxf-current-version-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dxf-current-version-matrix
      - name: Reproduce and validate the complete reviewed documentation tree
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, lzma, os, subprocess
          parts=[Path('.github/patches/coverage-'+str(i)+'.bin') for i in range(7)]
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='792ff018b4cc25ed62b87bb7cfe6f60f041911d51f862599d813018f7dfdd2c3'
          payload=json.loads(lzma.decompress(data))
          allowed={'tools/generate_dxf_coverage.py','tests/dxf_coverage/test_coverage.py','doc/dxf-conformance/README.md'}
          assert set(payload['files'])==allowed
          for name,content in payload['files'].items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8',newline='\n')
          temporary=Path(os.environ['RUNNER_TEMP'])
          prepare=temporary/'build-coverage-ledger.py';prepare.write_text(payload['prepare'],encoding='utf-8')
          subprocess.run(['python',str(prepare)],check=True)
          subprocess.run(['python','tools/generate_dxf_coverage.py'],check=True)
          patch=temporary/'coverage-ci.patch';patch.write_text(payload['ci_patch'],encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['python','tools/generate_dxf_coverage.py','--check'],check=True)
          subprocess.run(['python','-m','unittest','discover','-s','tests/dxf_coverage','-p','test_*.py'],check=True)
          for p in parts:p.unlink()
          workflow=Path('.github/workflows/prepare-coverage-ledger.yml');workflow.unlink()
          paths=sorted(allowed)+['.github/workflows/dxf-conformance.yml','.gitignore','doc/dxf-conformance/coverage.json','doc/dxf-conformance/version-feature-matrix.md','doc/dxf-conformance/version-feature-matrix-2026-09-12.md']
          subprocess.run(['git','add',*paths,*[str(p) for p in parts],str(workflow)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='30b72f3ff14645e202f69a465de0085b4d455e0e'
      - name: Commit only the documentation feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'docs: add versioned coverage ledger with generated comparison and CI checks'
          git push origin HEAD:audit/dxf-current-version-matrix
