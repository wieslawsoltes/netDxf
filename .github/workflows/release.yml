name: Release
on:
  push:
    tags: ['v[0-9]*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate/build/test/pack without creating a release or publishing a package
        type: boolean
        default: true
      publish_nuget:
        description: Validate an existing published release; pushing also requires dry_run=false and the NuGet opt-in
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name != 'release' && !inputs.publish_nuget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version, immutable tag target and netstandard ancestry
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python tools/ci/pipeline.py release-plan
  build:
    needs: plan
    uses: ./.github/workflows/ci-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
  github-release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-release
          path: artifacts/packages
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Revalidate source-bound assets and the live release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python tools/ci/publication.py
      - name: Create a draft without replacing any existing release or assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" artifacts/packages/* --verify-tag --draft --title "netDxf $VERSION" --notes-file artifacts/packages/RELEASE-NOTES.md "${args[@]}"

  publish-nuget:
    # Opt in explicitly; no package is published by installing these workflows.
    if: vars.NUGET_PUBLISH_ENABLED == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_nuget))
    environment: nuget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require an existing release tag on netstandard history
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          DRY_RUN: 'false'
        run: python tools/ci/pipeline.py release-plan
      - name: Download the published release assets, without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$TAG" --dir artifacts/packages
      - name: Revalidate source-bound assets and the live release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python tools/ci/publication.py
      - name: Require the NuGet trusted-publishing profile
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo 'Configure the NUGET_USER Actions variable with your nuget.org profile name.'; exit 1; }
      - name: Exchange GitHub OIDC for a short-lived NuGet key
        if: github.event_name == 'release' || !inputs.dry_run
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the verified packages and symbols (duplicates remain errors)
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --timeout 600
          done
