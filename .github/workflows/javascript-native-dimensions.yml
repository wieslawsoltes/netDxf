name: JavaScript source-lowered dimension generation
on:
  push:
    branches: ['codex/javascript-port']
    paths:
      - 'javascript/tools/NativePort/**'
      - 'javascript/tools/dotnet.mjs'
      - 'javascript/netDxf/Entities/Dimension.js'
      - 'javascript/runtime/DimensionRuntime.js'
      - '.github/workflows/javascript-native-dimensions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-native-dimensions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/codex/javascript-port'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CONFIGURATION: Release
      NETDXF_SOURCE_ROOT: ${{ github.workspace }}/_oracle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '3496ab91893a1e4ec9261b4833479f1799149cdc'
          path: _oracle
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reproduce the selected dimension source and preserve existing foundations
        shell: bash
        run: |
          set -euo pipefail
          node javascript/tools/dotnet.mjs native-port --check
          node javascript/tools/dotnet.mjs native-port --dimensions
          node javascript/tools/dotnet.mjs native-port --dimensions --check
          git add -- javascript/dimension-port-manifest.json \
            javascript/netDxf/Entities/AlignedDimension.js javascript/netDxf/Entities/LinearDimension.js \
            javascript/netDxf/Entities/Angular2LineDimension.js javascript/netDxf/Entities/Angular3PointDimension.js \
            javascript/netDxf/Entities/ArcLengthDimension.js javascript/netDxf/Entities/DiametricDimension.js \
            javascript/netDxf/Entities/RadialDimension.js javascript/netDxf/Entities/OrdinateDimension.js \
            javascript/netDxf/Entities/DimensionBlock.js
      - name: Publish generated paths only as a fast-forward of this input commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/javascript-port
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'feat(js): reproduce eight concrete dimensions and their source block builder'
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          fi
      - name: Retain exact generated source checkpoint
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/native-dimension-generation
          git archive --format=tar.gz --output=artifacts/native-dimension-generation/source-checkpoint.tar.gz HEAD
          git rev-parse HEAD > artifacts/native-dimension-generation/source-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/native-dimension-generation/source-tree.txt
          (cd artifacts/native-dimension-generation && sha256sum source-checkpoint.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-native-dimension-source
          path: artifacts/native-dimension-generation
          if-no-files-found: error
          retention-days: 7
