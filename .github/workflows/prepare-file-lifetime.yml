name: Apply reviewed file lifetime correction
on:
  push:
    branches: [fix/dxf-file-lifetime]
    paths: [.github/workflows/prepare-file-lifetime.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-file-lifetime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-file-lifetime
      - name: Apply exact tested patch and verify the resulting source tree
        shell: python
        run: |
          from pathlib import Path
          import gzip, hashlib, os, subprocess
          payload = Path('.github/patches/file-lifetime.gz')
          data = payload.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '36befdd76cf5cfe585924fa1fbc0723e2a3c724613091fec04a4e8c65805a36b'
          patch_bytes = gzip.decompress(data)
          assert hashlib.sha256(patch_bytes).hexdigest() == '98d8953c9e31a7f091a9046f0a967c821c2222c9f3000996cfcb21cc8b926cfe'
          patch = Path(os.environ['RUNNER_TEMP']) / 'file-lifetime.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          payload.unlink()
          Path('.github/workflows/prepare-file-lifetime.yml').unlink()
          subprocess.run(['git', 'add', 'netDxf/DxfDocument.cs', 'tests/netDxf.Conformance/RegressionTests.cs', 'tests/netDxf.Conformance/FileStreamLifetimeTests.cs', 'doc/dxf-conformance/file-stream-lifetime.md', '.github/patches/file-lifetime.gz', '.github/workflows/prepare-file-lifetime.yml'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '2fe56f5953016cef8801d72b78914ea42e20ce95'
      - name: Commit only on the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: dispose owned DXF files on every exit path'
          git push origin HEAD:fix/dxf-file-lifetime
