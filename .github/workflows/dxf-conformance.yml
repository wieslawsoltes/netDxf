name: DXF conformance
on:
  merge_group:
    types: [checks_requested]
    branches: [netstandard]
  push:
    branches: [netstandard, 'codex/dxf-*']
  pull_request:
    branches: [netstandard]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: dxf-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DXF_TEST_FILTER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install independent checker dependencies
        run: python -m pip install -r tools/requirements-independent.txt
      - name: Check coverage ledger and generated comparison
        run: |
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p "test_*.py"
          python -m unittest discover -s tests/standard_fields -p "test_*.py"
          python -m unittest discover -s tests/field_hosts -p "test_*.py"
      - name: Run version and format regression tests
        run: dotnet run --project tests/netDxf.Conformance/netDxf.Conformance.csproj --configuration ${{ matrix.configuration }}
      - name: Build netstandard API target
        run: dotnet build netDxf/netDxf.csproj --configuration ${{ matrix.configuration }} --framework netstandard2.0 --no-restore
      - name: Verify exported fixtures with an independent DXF reader
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: python tools/run_independent_verifiers.py artifacts/conformance
      - name: Collect source-level audit evidence
        if: runner.os == 'Linux' && matrix.configuration == 'Debug'
        run: |
          python3 tools/dxf_audit_inventory.py > artifacts/inventory.json
          dotnet run --project tools/netDxf.FieldAudit -- --self-test
          dotnet run --project tools/netDxf.FieldAudit -- . artifacts/field-audit
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
      - name: Bind reports to the tested source
        if: always()
        run: python tools/ci/pipeline.py provenance --directory artifacts
      - name: Retain fixtures, results, and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dxf-conformance-${{ matrix.os }}-${{ matrix.configuration }}
          path: artifacts/
          retention-days: 14
