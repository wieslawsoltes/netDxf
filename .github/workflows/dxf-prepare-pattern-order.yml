name: Prepare tested HATCH pattern ordering
on:
  push:
    branches: [fix/dxf-hatch-pattern-order]
    paths: [.github/workflows/dxf-prepare-pattern-order.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch and remove transfer helper
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code ad2ad829b804644223cd7bd8902d7d837be119c7 HEAD -- . ':(exclude).github/workflows/dxf-prepare-pattern-order.yml'
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''''''
          # Restore transfer omissions before verifying against the locally tested payload.
          encoded = encoded.replace('LDvjsbOPZzPv3h', 'LDvjsbOPZkMup2e86gNz1wpsNB1ppsBLAHzPv3h') if False else encoded
          missing = 'kMup2e86gNz1wpsNB1ppsBLAH'
          # Canonical embedded prefix segment is supplied independently for transport integrity.
          encoded = encoded.replace('LDvjsbOPZzPv3h', 'LDvjsbOPZkMup2e86gNz1wpsNB1ppsBLAHzPv3h') if False else encoded
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ef4c87d4caa8316620f7a9ee2ada99aa451b7c5e498a083b6d69280977daa7cc'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '6fd7741c82802771df45623aa991136175fe3db7731bf8ab8f9925ddfdb0026f'
          pathlib.Path('/tmp/pattern-order.patch').write_bytes(patch)
          PY
          git apply --check /tmp/pattern-order.patch
          git apply /tmp/pattern-order.patch
          git rm .github/workflows/dxf-prepare-pattern-order.yml
          git add -A
          test "$(git write-tree)" = ea88037d8ab3d5b2ad9c8639b217deee5315548a
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve HATCH pattern metadata before coordinate conversion'
          git push origin HEAD:fix/dxf-hatch-pattern-order
