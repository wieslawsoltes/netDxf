name: Apply reviewed binary chunk output validation
on:
  push:
    branches: [fix/dxf-binary-chunk-output]
    paths: [.github/workflows/prepare-binary-chunk-output.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-binary-chunk-output'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-binary-chunk-output
      - name: Apply exact checked edits and verify the full tested tree
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess
          p = Path('netDxf/IO/BinaryCodeValueWriter.cs')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '51a29f9dbcddd1d612b24aa2fd67e17589157bf2bd591a45ca079d83bf27dfc0'
          s = p.read_text()
          a = '        public void Write(short code, object value)\n        {\n'
          assert s.count(a) == 1
          s = s.replace(a, a + '            // Validate before writing the code or changing the current-tag state.\n            if ((code >= 310 && code <= 319) || code == 1004) ValidateBinaryChunk(value);\n')
          a = '        public void WriteBytes(byte[] value)\n        {\n'
          assert s.count(a) == 1
          s = s.replace(a, a + '            ValidateBinaryChunk(value);\n')
          pos = s.index('        public void WriteShort(short value)')
          helper = '\n'.join([
              '        private static void ValidateBinaryChunk(object value)',
              '        {',
              '            if (value == null) throw new ArgumentNullException(nameof(value));',
              '            byte[] bytes = value as byte[];',
              '            if (bytes == null)',
              '                throw new ArgumentException("A binary DXF chunk requires a byte array.", nameof(value));',
              '            // This is the framing limit, not a replacement for smaller record-specific limits.',
              '            if (bytes.Length > byte.MaxValue)',
              '                throw new ArgumentOutOfRangeException(nameof(value), bytes.Length,',
              '                    "A binary DXF chunk cannot exceed its one-byte length prefix. Split the data into valid records explicitly.");',
              '        }', '', ''])
          p.write_text(s[:pos] + helper + s[pos:])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'a3ebd19eb33d955806bff4f66c97facaaeb73d129f6d7ecbdf143b1b5e91b3b4'
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          s = p.read_text(); a = '        RegisterDoublePrecisionWriterTests();'
          assert s.count(a) == 1
          p.write_text(s.replace(a, a + '\n        RegisterBinaryChunkWriterTests();'))
          Path('.github/workflows/prepare-binary-chunk-output.yml').unlink()
          subprocess.run(['git','add','netDxf/IO/BinaryCodeValueWriter.cs','tests/netDxf.Conformance/RegressionTests.cs','.github/workflows/prepare-binary-chunk-output.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '826aa43c2befb6a4cec24c335d449a280e3bb337'
      - name: Commit only the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: reject oversized binary chunks before writing'
          git push origin HEAD:fix/dxf-binary-chunk-output
