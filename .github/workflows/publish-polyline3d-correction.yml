name: Publish exact Polyline3D correction
on:
  push:
    branches: [codex/dxf-polyline3d-edits-20260925]
    paths: [.github/workflows/publish-polyline3d-correction.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply hash-verified patch and require exact locally tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/dxf-polyline3d-edits-20260925
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64, hashlib, subprocess, zlib
          payload=''
          patch=zlib.decompress(base64.b64decode(payload,validate=True))
          assert len(patch)==4187 and hashlib.sha256(patch).hexdigest()=='9b5405cc3a23411a795cca042bd836c3c7ed977beb927ee23726d23e67fe213b'
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','apply','--whitespace=error','-'],input=patch,check=True)
          PY
          git add netDxf/Entities/Polyline3D.Topology.cs tests/shared/Polyline3DEditCases.cs tests/netDxf.Conformance/PolylineExplosionTests.cs
          git update-index --force-remove .github/workflows/publish-polyline3d-correction.yml
          test "$(git write-tree)" = 84b11cc47e0adbccae86ea13219be871effc89e4
          git reset HEAD -- .github/workflows/publish-polyline3d-correction.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Preserve validated no-op enumerators and seed explosion caches after setup'
          git push origin HEAD:refs/heads/codex/dxf-polyline3d-edits-20260925
