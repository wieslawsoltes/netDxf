name: Verify and apply named VIEW patch
on:
  push:
    branches: [feature/dxf-named-view-core]
    paths: [.github/workflows/dxf-repair-named-view.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-named-view-core'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Correct transcription and verify patch integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, pathlib, re, subprocess, zlib
          source = pathlib.Path('.github/workflows/dxf-prepare-named-view.yml').read_text()
          encoded = ast.literal_eval(re.search(r"encoded = ('.*')", source).group(1))
          fixes = {
              'TDriFWH3tVQi': 'TDriFWHmjWQi',
              'O3416j1+frrt7': 'O3416j1+rt7',
              'SNoAv2a/iropkuI8v': 'SNoAv2a/iropj9I8v',
              'Jo3kAgzUAxd10': 'Jo3k6jAgzUAxd10'
          }
          for old, new in fixes.items():
              if encoded.count(old) != 1:
                  raise RuntimeError('Transport correction precondition failed: ' + old)
              encoded = encoded.replace(old, new)
          pathlib.Path('/tmp/named-view-payload.txt').write_text(encoded)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          if len(patch) != 54681 or hashlib.sha256(patch).hexdigest() != '2500772b6105566b78add1d8622404a3848750b6c062dbf00cf72d655210eab1':
              raise RuntimeError('Patch integrity check failed')
          subprocess.run(['git', '-c', 'core.whitespace=cr-at-eol', 'apply', '--check', '--whitespace=error', '-'], input=patch, check=True)
          subprocess.run(['git', '-c', 'core.whitespace=cr-at-eol', 'apply', '--whitespace=error', '-'], input=patch, check=True)
          pathlib.Path('.github/workflows/dxf-prepare-named-view.yml').unlink()
          pathlib.Path('.github/workflows/dxf-repair-named-view.yml').unlink()
          PY
          git add netDxf/DxfDocument.cs netDxf/IO/DxfReader.cs netDxf/IO/DxfWriter.cs netDxf/IO/DxfReader.Views.cs netDxf/IO/DxfWriter.Views.cs netDxf/Tables/View.cs netDxf/Tables/ViewFlags.cs netDxf/Tables/ViewRenderMode.cs tests/netDxf.Conformance/RegressionTests.cs tests/netDxf.Conformance/NamedViewTests.cs doc/dxf-conformance/named-views.md .github/workflows/dxf-prepare-named-view.yml .github/workflows/dxf-repair-named-view.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: implement core named VIEW table read/write support'
          git push origin HEAD:feature/dxf-named-view-core
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: named-view-payload-diagnostic
          path: /tmp/named-view-payload.txt
          retention-days: 1
