name: Shadow DOM
on:
  pull_request:
    paths: ['shadow/**', '.github/workflows/shadow-ci.yml']
  push:
    branches: ['feature/immutable-shadow-dom']
    paths: ['shadow/**', '.github/workflows/shadow-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build all libraries and integrated Studio
        run: dotnet build shadow/samples/netDxf.Shadow.Studio/netDxf.Shadow.Studio.csproj -c Release -p:TargetFrameworks=net8.0 -clp:ErrorsOnly
      - name: Verify contracts, geometry, topology, editor and renderers
        run: dotnet run --project shadow/tests/netDxf.Shadow.Verification/netDxf.Shadow.Verification.csproj -c Release -p:TargetFrameworks=net8.0 -p:NoWarn=1591
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-verification
          path: artifacts
          if-no-files-found: ignore
      - name: Prepare minimal offline verification workspace
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline"
          git archive HEAD | gzip > "$RUNNER_TEMP/offline/source.tar.gz"
          python3 - <<'PY'
          import json, pathlib, os
          packages = set()
          for path in pathlib.Path('shadow').rglob('project.assets.json'):
              assets = json.loads(path.read_text())
              packages.update(key.lower() for key, item in assets['libraries'].items() if item['type'] == 'package')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'offline', 'package-list.txt').write_text('\n'.join(sorted(packages)))
          PY
          tar -czf "$RUNNER_TEMP/offline/packages.tar.gz" --exclude='*.nupkg' --exclude='runtimes/win*' --exclude='runtimes/osx*' --exclude='runtimes/linux-arm*' -C "$HOME/.nuget/packages" -T "$RUNNER_TEMP/offline/package-list.txt"
          cd "$DOTNET_ROOT"
          sdk=$(find sdk -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          runtime=$(find shared/Microsoft.NETCore.App -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          aspnet=$(find shared/Microsoft.AspNetCore.App -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          fxr=$(find host/fxr -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          ref=$(find packs/Microsoft.NETCore.App.Ref -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          webref=$(find packs/Microsoft.AspNetCore.App.Ref -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          apphost=$(find packs/Microsoft.NETCore.App.Host.linux-x64 -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          tar -czf "$RUNNER_TEMP/offline/dotnet.tar.gz" dotnet "$fxr" "$sdk" "$runtime" "$aspnet" "$ref" "$webref" "$apphost" packs/NETStandard.Library.Ref
          ls -lh "$RUNNER_TEMP/offline"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: shadow-offline-source
          path: ${{ runner.temp }}/offline/source.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: shadow-offline-dotnet
          path: ${{ runner.temp }}/offline/dotnet.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: shadow-offline-packages
          path: ${{ runner.temp }}/offline/packages.tar.gz
          compression-level: 0
          retention-days: 1
