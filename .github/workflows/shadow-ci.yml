name: Shadow DOM
on:
  pull_request:
    paths: ['shadow/**', '.github/workflows/shadow-ci.yml']
  push:
    branches: ['feature/immutable-shadow-dom']
    paths: ['shadow/**', '.github/workflows/shadow-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build all libraries and integrated Studio
        run: dotnet build shadow/samples/netDxf.Shadow.Studio/netDxf.Shadow.Studio.csproj -c Release -p:TargetFrameworks=net8.0
      - name: Verify contracts, geometry, topology, editor and renderers
        run: dotnet run --project shadow/tests/netDxf.Shadow.Verification/netDxf.Shadow.Verification.csproj -c Release -p:TargetFrameworks=net8.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-verification
          path: artifacts
          if-no-files-found: ignore
