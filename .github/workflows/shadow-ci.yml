name: Shadow DOM
on:
  pull_request:
    paths: ['shadow/**', '.github/workflows/shadow-ci.yml']
  push:
    branches: ['feature/immutable-shadow-dom']
    paths: ['shadow/**', '.github/workflows/shadow-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build shadow adapter
        run: dotnet build shadow/src/netDxf.Shadow.NetDxf/netDxf.Shadow.NetDxf.csproj -c Release -p:TargetFrameworks=net8.0
