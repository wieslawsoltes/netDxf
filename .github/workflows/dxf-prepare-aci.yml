name: Prepare tested gradient ACI preservation
on:
  push:
    branches: [fix/dxf-hatch-gradient-aci-retention]
    paths: [.github/workflows/dxf-prepare-aci.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-hatch-gradient-aci-retention
          fetch-depth: 0
      - name: Verify and apply exact tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 77e7cdbd86fa0c8d2d31bf1d0a1eaaab1e006767
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          packed = b''.join((Path('.github/aci-transfer') / str(i)).read_bytes() for i in range(6))
          assert hashlib.sha256(packed).hexdigest() == 'a135f1540a71fa88002741d93cb77079ed3f877085b4b67640454e556911f93e'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'b1f32dc3705cad0c4a48c553dc188d4f58f71b3325893c21eac3d4fbc1469801'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm -r .github/aci-transfer .github/workflows/dxf-prepare-aci.yml
          git add -A
          test "$(git write-tree)" = dda8d8e44fa78c3834ede6982b098fbe967533ce
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: retain independent optional HATCH gradient ACI metadata'
          git push origin HEAD:fix/dxf-hatch-gradient-aci-retention
