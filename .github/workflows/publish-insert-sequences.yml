name: Publish exact INSERT sequence source
on:
  push:
    branches: [codex/dxf-insert-geometry-20260925]
    paths: [.github/workflows/publish-insert-sequences.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact committed patch and verify complete source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/dxf-insert-geometry-20260925
          test -z "$(git status --porcelain)"
          git update-index --force-remove .github/workflows/publish-insert-sequences.yml
          test "$(git write-tree)" = f64423292f0de6fc9de5b4d86f3868cfd213b9da
          git reset HEAD -- .github/workflows/publish-insert-sequences.yml
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = ''''''
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3139b32e1d3a9eaf0e0b9701b1a265365dcad9286a84f3380356206952e97841'
          Path('/tmp/insert-sequences.patch').write_bytes(patch)
          PY
          git -c core.whitespace=cr-at-eol apply --index --binary /tmp/insert-sequences.patch
          git update-index --force-remove .github/workflows/publish-insert-sequences.yml
          test "$(git write-tree)" = ef9e7d87d6fe401275ba1af97c8474989b799a61
          git reset HEAD -- .github/workflows/publish-insert-sequences.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Retain registered INSERT sequence terminators and validate DXF ownership'
          git push origin HEAD:refs/heads/codex/dxf-insert-geometry-20260925
