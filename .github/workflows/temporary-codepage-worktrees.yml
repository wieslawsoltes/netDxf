name: Temporary code-page worktree verification
on:
  push:
    branches: [codex/verify-codepage-worktrees-20261004]
    paths: [.github/workflows/temporary-codepage-worktrees.yml]
permissions:
  contents: read
concurrency:
  group: codepage-worktree-preflight
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c6f589f4c3b580c7ad6ea29e026128f3836c3cdd
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create isolated source, Debug and Release worktrees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD^{tree})" = 6aa272f6ddc07443821e16f93c54f5f03022ffa7
          git worktree add --detach "$RUNNER_TEMP/codepage-Debug" HEAD
          git worktree add --detach "$RUNNER_TEMP/codepage-Release" HEAD
          git worktree add --detach "$RUNNER_TEMP/codepage-oracle" HEAD
          git worktree list --porcelain | tee evidence/worktrees.txt
          git rev-parse HEAD HEAD^{tree} | tee evidence/source.txt
      - name: Run focused C# suites concurrently
        shell: bash
        run: |
          set -uo pipefail
          run_suite() {
            config="$1"
            out="$GITHUB_WORKSPACE/evidence/$config"
            mkdir -p "$out"
            cd "$RUNNER_TEMP/codepage-$config"
            DXF_TEST_FILTER=r12-codepage DXF_TEST_ARTIFACTS="$out/fixtures" \
              dotnet run --project tests/netDxf.Conformance/netDxf.Conformance.csproj -c "$config" -p:NuGetAudit=false > "$out/console.log" 2>&1
          }
          run_suite Debug & debug=$!
          run_suite Release & release=$!
          status=0
          wait "$debug" || status=1
          wait "$release" || status=1
          tail -n 35 evidence/Debug/console.log
          tail -n 35 evidence/Release/console.log
          exit "$status"
      - name: Run independent oracle self-tests and actual drawing checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements-independent.txt
          cd "$RUNNER_TEMP/codepage-oracle"
          python -m unittest discover -s tests/dxf_coverage -p test_r12_codepages.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/oracle-self-tests.log"
          for config in Release Debug; do
            python tools/verify_r12_codepages.py "$GITHUB_WORKSPACE/evidence/$config/fixtures" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/independent-$config.log"
            python tools/verify_r12_dos_conversion.py "$GITHUB_WORKSPACE/evidence/$config/fixtures" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/dos-$config.log"
          done
      - name: Package only incremental source and verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 3a20b14ed42110f1d39c6b7ebd27ac91d474cfd3
          git diff --binary --full-index 3a20b14ed42110f1d39c6b7ebd27ac91d474cfd3 HEAD > evidence/continuation.patch
          git diff --check 3a20b14ed42110f1d39c6b7ebd27ac91d474cfd3 HEAD
          python3 - <<'PY'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          base = '3a20b14ed42110f1d39c6b7ebd27ac91d474cfd3'
          out = Path('evidence')
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          for name in paths:
              file = Path(name)
              if file.suffix not in ('.cs', '.py') or '..' in file.parts:
                  raise SystemExit('Unexpected incremental source path: ' + name)
              target = out / 'changed-source' / file
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(file, target)
          receipt = {'base': base,
                     'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'changed_files': paths,
                     'scope': 'Incremental source and focused hosted worktree evidence; complete CI qualification is separate.'}
          (out / 'source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (out / 'README.txt').write_text('Apply continuation.patch to base ' + base + ' using git apply --check then git apply.\nThis is an incremental source bundle, not a full checkout or binary release.\nDebug and Release repeat one focused suite; oracle self-tests are not library execution.\nComplete repository CI remains a separate merge gate.\n')
          checksums = []
          for file in sorted(out.rglob('*')):
              if file.is_file() and file.name != 'SHA256SUMS.txt':
                  checksums.append(hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + file.relative_to(out).as_posix())
          (out / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          print(json.dumps(receipt, indent=2))
          print('Hashed evidence entries:', len(checksums))
          PY
      - name: Retain immutable source and worktree test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codepage-worktree-preflight
          path: evidence
          retention-days: 7
