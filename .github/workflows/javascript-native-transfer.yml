name: Commit native JavaScript foundations
on:
  pull_request:
    branches: [netstandard]
    paths: ['.github/native-port-transfer/**', '.github/workflows/javascript-native-transfer.yml']
permissions:
  contents: read
jobs:
  commit-source:
    if: github.event.pull_request.number == 98 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/javascript-port'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Restore exact native source and regenerate from pinned C#
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD^') != 'e02555dd78324d873cc12edd94d3c9e01c0ac35d':
              raise RuntimeError('Unexpected checkpoint parent.')
          parts = [pathlib.Path('.github/native-port-transfer/part-%d.txt' % i) for i in range(4)]
          packed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(packed).hexdigest() != '01654f40a4acdf77b33a205e5f9a3b54766051260c31bc0701b618d9b39c1dbc':
              raise RuntimeError('Checkpoint payload integrity failure.')
          patch = lzma.decompress(packed)
          if len(patch) != 177414:
              raise RuntimeError('Unexpected decoded patch length.')
          patchfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-foundations.patch'
          patchfile.write_bytes(patch)
          git('apply', '--check', '--index', str(patchfile))
          git('apply', '--index', '--whitespace=error-all', str(patchfile))
          changed = git('diff', '--cached', '--name-only').splitlines()
          if len(changed) != 35 or any(not p.startswith('javascript/') for p in changed):
              raise RuntimeError('Unexpected source path or file count.')
          subprocess.run(['node', 'javascript/tools/dotnet.mjs', 'native-port'], check=True)
          git('add', '--', 'javascript')
          tree = git('write-tree')
          if git('ls-tree', tree, 'javascript').split()[2] != '7b11a90810821d8ef9a9c2b331b0ee3fd076099b':
              raise RuntimeError('Generated JavaScript tree differs from the tested source.')
          subprocess.run(['npm', '--prefix', 'javascript', 'test'], check=True)
          subprocess.run(['npm', '--prefix', 'javascript', 'run', 'test:unit'], check=True)
          git('rm', '--', *[str(p) for p in parts])
          if git('ls-remote', 'origin', 'refs/heads/codex/javascript-port').split()[0] != os.environ['EXPECTED_HEAD']:
              raise RuntimeError('Branch advanced concurrently; refusing to overwrite work.')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat(js): port native typed foundations and collections with exact .NET baseline tests')
          git('push', 'origin', 'HEAD:refs/heads/codex/javascript-port')
          print('Committed source:', git('rev-parse', 'HEAD'))
          print('Source tree:', git('write-tree'))
          PY
