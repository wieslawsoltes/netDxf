name: Apply reviewed tolerance-label source patch
on:
  push:
    branches: [codex/dxf-tolerance-labels-20260923]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify patch and original source, apply, and remove staging files
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 7ff27a8d58e9978d06bb61be2fde2e4e7a3bc20c
          echo '7132c44c4570cc05f32e3eb758a46b86e1102bb2f1cbf851352772307abbb643  tools/tolerance-labels-core.patch' | sha256sum --check
          test "$(git hash-object netDxf/Entities/DimensionBlock.AlternateUnits.cs)" = 4f0425da7da17fe1d6cdae9c8fa98dc973f77734
          test "$(git hash-object netDxf/Entities/DimensionBlock.cs)" = 175bbf23f3c2c32864c03da0c12cc9e67eec8008
          test "$(git hash-object tests/netDxf.Conformance/Program.cs)" = 486ff7dbd6bc7ba375f2bbcc427997a5fc4ed8e4
          git apply --index tools/tolerance-labels-core.patch
          git rm tools/tolerance-labels-core.patch .github/workflows/tolerance-label-source-stage.yml
          test "$(git write-tree)" = 99224458436039d29a870da5c2a18ae4949a3303
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Generate dimension tolerance and limit labels with inherited settings; remove source staging'
          git push origin HEAD:refs/heads/codex/dxf-tolerance-labels-20260923
