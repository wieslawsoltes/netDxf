name: Publish reviewed table metadata source
on:
  push:
    branches: [codex/dxf-table-xdata-preservation-20260922]
    paths: [.github/workflows/publish-table-reviewed.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply locally rehearsed readable edits and remove publishing files
        run: |
          echo 'c8c8fad762019b8572e6779f3b607744b02afa75ce2fb4361e0682c108844905  tools/_publish_table_core.py' | sha256sum --check
          python3 tools/_publish_table_core.py
          git add -u
          test "$(git write-tree)" = '7cfe9573dceb27c9be6c78228e53f89e19809358'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve table XData and legacy units without losing explicit transparency resets'
          git push origin HEAD:refs/heads/codex/dxf-table-xdata-preservation-20260922
