name: Apply reviewed raw record indexing
on:
  push:
    branches: [feature/dxf-raw-records]
    paths: [.github/workflows/prepare-raw-records.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-raw-records'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-raw-records
      - name: Apply exact tested patch and verify the entire source tree
        shell: python
        run: |
          from pathlib import Path
          import gzip, hashlib, os, subprocess
          payload = Path('.github/patches/raw-records.gz')
          data = payload.read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'd3e29300ebcad946becde283658a661c62afae75e1d30764dea8cb22cb7817fd'
          patch_bytes = gzip.decompress(data)
          assert hashlib.sha256(patch_bytes).hexdigest() == 'aadf03ca97d424af20f4e829b26be41d3d5a049fb8aaa387b924e6996556b588'
          patch = Path(os.environ['RUNNER_TEMP']) / 'raw-records.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          payload.unlink()
          Path('.github/workflows/prepare-raw-records.yml').unlink()
          paths = ['doc/dxf-conformance/raw-records.md', 'netDxf/IO/DxfRawDocument.cs', 'netDxf/IO/DxfRawRecord.cs', 'netDxf/IO/DxfRawSection.cs', 'netDxf/IO/DxfTagSlice.cs', 'tests/netDxf.Conformance/RawRecordTests.cs', 'tests/netDxf.Conformance/RegressionTests.cs', 'tools/verify_raw_record_edits.py', '.github/patches/raw-records.gz', '.github/workflows/prepare-raw-records.yml']
          subprocess.run(['git', 'add', *paths], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '9709257f60ef8c48aa0c28edd229b6d60e71114a'
      - name: Commit only on the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: index raw DXF records and support scoped immutable edits'
          git push origin HEAD:feature/dxf-raw-records
