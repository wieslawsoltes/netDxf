name: Apply reviewed MESH Blend Crease support
on:
  push:
    branches: [feature/dxf-mesh-blend]
    paths: [.github/workflows/prepare-mesh-blend.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-mesh-blend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-mesh-blend
      - name: Apply exact tested production patch and verify entire tree
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, os, subprocess
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='1157dd74ab6cd3b00a914b9bb000caf22436702cf78efaa42072e43050a46362'
          path=Path(os.environ['RUNNER_TEMP'])/'mesh-blend.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          Path('.github/workflows/prepare-mesh-blend.yml').unlink()
          subprocess.run(['git','add','netDxf/Entities/Mesh.cs','netDxf/IO/DxfReader.cs','netDxf/IO/DxfWriter.cs','tests/netDxf.Conformance/RegressionTests.cs','.github/workflows/prepare-mesh-blend.yml'],check=True)
          actual=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual=='1b8c4f4e36eefdbc0f3a2c9001cb21abb4a2f741',actual
      - name: Commit the verified feature branch only
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: retain and edit MESH Blend Crease metadata'
          git push origin HEAD:feature/dxf-mesh-blend
