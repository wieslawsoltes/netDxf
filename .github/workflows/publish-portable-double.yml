name: Publish exact portable-double source
on:
  push:
    branches: [codex/dxf-portable-double-20260925]
    paths: [.github/workflows/publish-portable-double.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Integrate fixed byte edits and require the exact locally committed tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/dxf-portable-double-20260925
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('netDxf/IO/TextCodeValueReader.cs')
          b = p.read_bytes()
          a = b.index(b'            if (valueString.IndexOf', b.index(b'private double ReadDouble(string valueString)'))
          z = b.index(b'            throw this.InvalidValue("finite double-precision number");', a)
          p.write_bytes(b[:a] + b'            if (DxfDoubleParser.TryParse(valueString, out double result))\n                return result;\n' + b[z:])
          p = Path('netDxf/netDxf.csproj')
          b = p.read_bytes()
          assert b.count(b'</Project>') == 1
          p.write_bytes(b.replace(b'</Project>', b'  <ItemGroup Condition="\'$(TargetFramework)\' == \'net471\' Or \'$(TargetFramework)\' == \'net48\'">\r\n    <Reference Include="System.Numerics" />\r\n  </ItemGroup>\r\n\r\n</Project>'))
          for name, old, new in [
              ('tests/netDxf.Conformance/Program.cs', b'        RegisterUnderlayScaleTests();', b'        RegisterUnderlayScaleTests();\n        RegisterPortableDoubleTests();'),
              ('tests/netDxf.PackageSmoke/Program.cs', b'// These assertions run against each selected installed package assembly.', b'// These assertions run against each selected installed package assembly.\nNetDxf.Qualification.PortableDoubleCases.VerifyInstalled(typeof(DxfDocument).Assembly);')]:
              p = Path(name); b = p.read_bytes(); assert b.count(old) == 1
              p.write_bytes(b.replace(old, new))
          for name in ['netDxf.Conformance', 'netDxf.PackageSmoke', 'netDxf.TargetSmoke']:
              p = Path('tests') / name / (name + '.csproj'); b = p.read_bytes()
              snippet = b'  <ItemGroup>\n    <Compile Include="../shared/PortableDoubleCases.cs" Link="PortableDoubleCases.cs" />\n  </ItemGroup>\n'
              if name == 'netDxf.TargetSmoke':
                  snippet += b'  <ItemGroup Condition="\'$(TargetFramework)\' == \'net471\' Or \'$(TargetFramework)\' == \'net48\'">\n    <Reference Include="System.Numerics" />\n  </ItemGroup>\n'
              assert b.count(b'</Project>') == 1
              p.write_bytes(b.replace(b'</Project>', snippet + b'</Project>'))
          PY
          git add netDxf/IO/TextCodeValueReader.cs netDxf/netDxf.csproj tests/netDxf.Conformance/Program.cs tests/netDxf.Conformance/netDxf.Conformance.csproj tests/netDxf.PackageSmoke/Program.cs tests/netDxf.PackageSmoke/netDxf.PackageSmoke.csproj tests/netDxf.TargetSmoke/netDxf.TargetSmoke.csproj
          git update-index --force-remove .github/workflows/publish-portable-double.yml
          test "$(git write-tree)" = 25a450f5d51dd59f732953a93e9dcc33fd5bad58
          git reset HEAD -- .github/workflows/publish-portable-double.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Integrate portable binary64 reader and shared package qualification'
          git push origin HEAD:refs/heads/codex/dxf-portable-double-20260925
