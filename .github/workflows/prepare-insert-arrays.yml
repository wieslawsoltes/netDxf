name: Apply reviewed INSERT array integration
on:
  push:
    branches: [feature/dxf-insert-arrays]
    paths: [.github/workflows/prepare-insert-arrays.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-insert-arrays'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-insert-arrays
      - name: Apply reviewed edits and compare complete locally tested file hashes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          expected_before = {
              'netDxf/Entities/Insert.cs': '5792000356c918052bcef627a1894f31814f7046d06b33268f77df92db375a3d',
              'netDxf/IO/DxfReader.cs': '60b803facda8a7f96d9f8251d89a1894cc95bbecbfb792d67087f92c96100c7e',
              'netDxf/IO/DxfWriter.cs': 'a62dcc2aa1178556123037218e946666a2cc2e9916fb134e462c6751cc1ae1e8',
              'netDxf/SubclassMarker.cs': '0028f180f1c8d2db21505597fb486271ca919ad1f914d4bb28e091829b08cec5',
              'tests/netDxf.Conformance/RegressionTests.cs': 'bab9083fbb028638b160d413211b7fdfe872f382a86bff39e481371ae5246431'
          }
          for name, digest in expected_before.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          license = Path('netDxf/IO/DxfReader.cs').read_text().split('using System;')[0]
          p = Path('netDxf/Entities/Insert.Array.cs'); assert p.read_text().startswith('using System;')
          p.write_text(license + p.read_text())
          p = Path('netDxf/Entities/Insert.cs'); s = p.read_text()
          s = s.replace('public class Insert :', 'public partial class Insert :', 1)
          old = '\n'.join(['        public List<EntityObject> Explode()', '        {',
              '            List<EntityObject> entities = new List<EntityObject>();',
              '            Matrix3 transformation = this.GetTransformation();',
              '            Vector3 translation = this.Position - transformation * this.block.Origin;'])
          new = '\n'.join(['        public List<EntityObject> Explode()', '        {',
              '            return new List<EntityObject>(this.ExplodeEnumerable());', '        }', '',
              '        private List<EntityObject> ExplodeCellCore(Matrix3 transformation, Vector3 translation, Vector3 arrayOffset)',
              '        {', '            List<EntityObject> entities = new List<EntityObject>();'])
          assert s.count(old) == 1; s = s.replace(old, new)
          old = '                    Position = attribute.Position,'; assert s.count(old) == 1
          s = s.replace(old, '                    Position = attribute.Position + arrayOffset,')
          old = '        public override void TransformBy(Matrix3 transformation, Vector3 translation)\n        {'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n            if (this.IsMultiple)\n            {\n                this.TransformArray(transformation, translation);\n                return;\n            }\n')
          old = '                Rotation = this.rotation,\n'; assert s.count(old) == 1
          s = s.replace(old, old + '                ColumnCount = this.columnCount,\n                RowCount = this.rowCount,\n                ColumnSpacing = this.columnSpacing,\n                RowSpacing = this.rowSpacing,\n')
          p.write_bytes(s.replace('\n', '\r\n').encode())
          p = Path('netDxf/IO/DxfReader.cs'); s = p.read_text()
          a = s.index('        private Insert ReadInsert(bool isBlockEntity)'); b = s.index('        private Line ReadLine()', a)
          body = s[a:b].replace('            double rotation = 0.0;', '            double rotation = 0.0;\n            short columns = 1, rows = 1;\n            double columnSpacing = 0.0, rowSpacing = 0.0;')
          old = '                    case 50:\n                        rotation = this.chunk.ReadDouble();'; assert body.count(old) == 1
          new = '\n'.join([
              '                    case 70:', '                    case 71:',
              '                        short count = this.chunk.ReadShort();', '                        if (count < 1)', '                        {',
              '                            throw new InvalidDataException(string.Format("INSERT array count for group {0} must be positive at position {1}.", this.chunk.Code, this.chunk.CurrentPosition));',
              '                        }', '                        if (this.chunk.Code == 70) columns = count;', '                        else rows = count;',
              '                        this.chunk.Next();', '                        break;', '                    case 44:',
              '                        columnSpacing = this.chunk.ReadDouble();', '                        this.chunk.Next();', '                        break;',
              '                    case 45:', '                        rowSpacing = this.chunk.ReadDouble();', '                        this.chunk.Next();', '                        break;', ''])
          body = body.replace(old, new + old)
          old = '                Scale = scale,\n'; assert body.count(old) == 1
          body = body.replace(old, old + '                ColumnCount = columns,\n                RowCount = rows,\n                ColumnSpacing = columnSpacing,\n                RowSpacing = rowSpacing,\n')
          p.write_text(s[:a] + body + s[b:])
          p = Path('netDxf/IO/DxfWriter.cs'); s = p.read_text()
          a = s.index('        private void WriteInsert(Insert insert)'); b = s.index('        private void WriteLine(', a)
          body = s[a:b].replace('this.chunk.Write(100, SubclassMarker.Insert);', 'this.chunk.Write(100, insert.IsMultiple ? SubclassMarker.MInsert : SubclassMarker.Insert);')
          old = '            this.chunk.Write(50, insert.Rotation);\n'; assert body.count(old) == 1
          new = '\n'.join(['',
              '            if (insert.ColumnCount != 1) this.chunk.Write(70, insert.ColumnCount);',
              '            if (insert.RowCount != 1) this.chunk.Write(71, insert.RowCount);',
              "            // Grid spacing is already in the containing coordinate system's units.",
              '            // The block scale/unit conversion above does not apply to these distances.',
              '            if (insert.ColumnSpacing != 0.0) this.chunk.Write(44, insert.ColumnSpacing);',
              '            if (insert.RowSpacing != 0.0) this.chunk.Write(45, insert.RowSpacing);', ''])
          body = body.replace(old, old + new); p.write_text(s[:a] + body + s[b:])
          p = Path('netDxf/SubclassMarker.cs'); data = p.read_bytes()
          old = b'        public const string Insert = "AcDbBlockReference";\r\n'; assert data.count(old) == 1
          p.write_bytes(data.replace(old, old + b'        public const string MInsert = "AcDbMInsertBlock";\r\n'))
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          p.write_text(p.read_text().replace('        RegisterClassDefinitionTests();', '        RegisterClassDefinitionTests();\n        RegisterInsertArrayTests();'))
          expected = {
              'netDxf/Entities/Insert.Array.cs': 'cf1c6d44b723dc21bc52f884f1d894d2f5737fc5e47ac7b1067c78f3abfa152c',
              'netDxf/Entities/Insert.cs': '656048ea7629f32ce3a06400d59a026deb118ba5fa9591c6d949286d58896f2a',
              'netDxf/IO/DxfReader.cs': '32bfa6b2d9313b37b004db229a1bfacbd36cfea41feae54d9e69e83cd33a9627',
              'netDxf/IO/DxfWriter.cs': '840fadb49b2e39555a81d81d48a6f5d6574a5e4741e23a13504e22af03dd76ca',
              'netDxf/SubclassMarker.cs': '3a5ec41ba2aea7e10a4f26f270435b984964991e88d93673e922d2fc87180cef',
              'tests/netDxf.Conformance/RegressionTests.cs': '89d6151919efb14792e8f5ac77f0ec5fc315178f53a16f4fb5f29a91a35c39a2',
              'tests/netDxf.Conformance/InsertArrayTests.cs': '2146f0c6bacb26b52483816fd68d0b38591d088b641029bcd585254ab5967e04',
              'doc/dxf-conformance/insert-arrays.md': '968e9a6fa23b49d7a329a5d5909fec994e1a6c39e7c5552cc7451eb43d36895c'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          Path('.github/workflows/prepare-insert-arrays.yml').unlink()
      - name: Commit verified changes only to the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add netDxf/Entities/Insert.Array.cs netDxf/Entities/Insert.cs netDxf/IO/DxfReader.cs netDxf/IO/DxfWriter.cs netDxf/SubclassMarker.cs tests/netDxf.Conformance/RegressionTests.cs .github/workflows/prepare-insert-arrays.yml
          git commit -m 'feat: integrate rectangular INSERT array IO and geometry'
          git push origin HEAD:feature/dxf-insert-arrays
