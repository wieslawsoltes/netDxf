name: Prepare isolated binary chunk fix
on:
  push:
    branches: [codex/dxf-binary-chunks]
    paths: [.github/workflows/dxf-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/codex/dxf-binary-chunks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked production edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('netDxf/IO/BinaryCodeValueReader.cs')
          s = p.read_text()
          old = '            return this.reader.ReadBytes(length);'
          new = '\n'.join([
              '            byte[] bytes = this.reader.ReadBytes(length);',
              '            if (bytes.Length != length)',
              '            {',
              '                throw new EndOfStreamException(string.Format(CultureInfo.InvariantCulture,',
              '                    "Incomplete binary DXF chunk for group {0}: expected {1} bytes, received {2}.",',
              '                    this.code, length, bytes.Length));',
              '            }',
              '            return bytes;'])
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          Path('.github/workflows/dxf-prepare.yml').unlink()
          PY
          git add netDxf/IO/BinaryCodeValueReader.cs .github/workflows/dxf-prepare.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reject truncated binary DXF chunks'
          git push origin HEAD:codex/dxf-binary-chunks
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package a minimal compiler for additional local audit testing
        shell: bash
        run: |
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk="$(find "$root/sdk" -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)"
          runtime="$(find "$root/shared/Microsoft.NETCore.App" -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)"
          host="$(find "$root/host/fxr" -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)"
          reference="$(find "$root/packs/Microsoft.NETCore.App.Ref" -mindepth 1 -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)"
          test -n "$sdk" && test -n "$runtime" && test -n "$host" && test -n "$reference"
          mkdir -p /tmp/dxf-toolchain/shared/Microsoft.NETCore.App /tmp/dxf-toolchain/host/fxr
          cp "$root/dotnet" /tmp/dxf-toolchain/
          cp -a "$runtime" /tmp/dxf-toolchain/shared/Microsoft.NETCore.App/
          cp -a "$host" /tmp/dxf-toolchain/host/fxr/
          cp -a "$sdk/Roslyn/bincore" /tmp/dxf-toolchain/compiler
          cp -a "$reference/ref/net8.0" /tmp/dxf-toolchain/reference
          for file in LICENSE.txt ThirdPartyNotices.txt; do
            test ! -f "$root/$file" || cp "$root/$file" /tmp/dxf-toolchain/
          done
          tar -czf /tmp/dxf-toolchain.tar.gz -C /tmp dxf-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: dxf-linux-audit-compiler
          path: /tmp/dxf-toolchain.tar.gz
          retention-days: 1
