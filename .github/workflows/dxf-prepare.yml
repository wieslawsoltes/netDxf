name: Align isolated DXF source change
on:
  push:
    branches: [codex/dxf-binary-sentinel]
    paths: [.github/workflows/dxf-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/codex/dxf-binary-sentinel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('netDxf/IO/BinaryCodeValueReader.cs')
          s = p.read_text()
          start = s.index('  this.encoding = encoding ??')
          end = s.index('\n\n            this.code = 0;', start)
          s = s[:start] + '\n'.join('          ' + line for line in s[start:end].split('\n')) + s[end:]
          p.write_text(s)
          Path('.github/workflows/dxf-prepare.yml').unlink()
          PY
          git add netDxf/IO/BinaryCodeValueReader.cs .github/workflows/dxf-prepare.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: align sentinel validation with surrounding C#'
          git push origin HEAD:codex/dxf-binary-sentinel
