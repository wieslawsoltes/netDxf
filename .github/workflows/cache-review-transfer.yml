name: Materialize reviewed cached-direction fix
on:
  push:
    branches: [codex/cache-review-transfer-20260917]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: implementation
          ref: af13f82016ad35c87e8446814b568e1374488702
      - name: Reproduce complete tested tree and publish clean child
        shell: python
        env:
          GIT_AUTHOR_NAME: Wiesław Šoltés
          GIT_AUTHOR_EMAIL: wieslawsoltes@users.noreply.github.com
          GIT_COMMITTER_NAME: Wiesław Šoltés
          GIT_COMMITTER_EMAIL: wieslawsoltes@users.noreply.github.com
        run: |
          import pathlib, subprocess
          work = pathlib.Path('implementation').resolve()
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=work).decode().strip()
          base = 'af13f82016ad35c87e8446814b568e1374488702'
          assert git('rev-parse', 'HEAD') == base
          assert git('rev-parse', 'HEAD^{tree}') == 'c0b24c556dd818c8e4dfe05e3eeea23afd3dab67'
          def replace(name, old, new):
              path = work / name
              data = path.read_bytes()
              assert data.count(old) == 1, name
              path.write_bytes(data.replace(old, new, 1))
          replace('netDxf/Vector3.cs',
              b'            // Preserve exact already-normalized values (including signed zeros)\r\n            // through repeated assignments and clone initialization.\r\n            if (value.isNormalized)\r\n            {\r\n                return value;\r\n            }',
              b'            // The public utility may cache an inaccurate finite length after\r\n            // subnormal sum-of-squares rounding. Trust its flag only after a\r\n            // component-based unit check, never through Modulus (which uses it).\r\n            // Keep valid cached values bit-exact, including signed zeros.\r\n            if (value.isNormalized &&\r\n                Math.Abs(value.x * value.x + value.y * value.y + value.z * value.z - 1.0) <= 2e-15)\r\n            {\r\n                return value;\r\n            }')
          replace('tests/netDxf.Conformance/Program.cs',
              b'        RegisterDirectionAssignmentTests();',
              b'        RegisterDirectionAssignmentTests();\n        RegisterDirectionCachedNormalizationTests();')
          replace('doc/dxf-conformance/direction-assignment.md',
              b'when a value carries a cached normalized flag, so a cached zero or NaN produced\nby the old public utility cannot bypass the new property checks.',
              b'when a value carries a cached normalized flag, so a cached zero or NaN produced\nby the old public utility cannot bypass the new property checks. A cached finite\nvalue must also have a component-based squared length within `2e-15` of one.\nOtherwise it is normalized again. The public utility can produce an inaccurate\nfinite cache after subnormal sum-of-squares rounding; its flag is not proof of\nunit length. Valid cached values still preserve their exact component bits.')
          target = work / 'tests/netDxf.Conformance/DirectionCachedNormalizationTests.cs'
          assert not target.exists()
          target.write_bytes(pathlib.Path('transport/.review-transfer/DirectionCachedNormalizationTests.cs').read_bytes())
          git('add', '-A')
          tree = git('write-tree')
          assert tree == 'f3f7f691479d7d20b83eeae7e45ea3fda4fecc02', tree
          commit = git('commit-tree', tree, '-p', base, '-m', 'fix: validate cached vector length before direction assignment')
          branch = 'codex/cache-review-materialized-20260917'
          assert not git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch)
          git('push', 'origin', commit + ':refs/heads/' + branch)
          print('REVIEWED_COMMIT=' + commit + '\nREVIEWED_TREE=' + tree)
