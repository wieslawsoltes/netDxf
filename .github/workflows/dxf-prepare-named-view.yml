name: Prepare tested named VIEW implementation
on:
  push:
    branches: [feature/dxf-named-view-core]
    paths: [.github/workflows/dxf-prepare-named-view.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-named-view-core'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact locally tested patch and remove preparation workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          if len(patch) != 54681 or hashlib.sha256(patch).hexdigest() != '2500772b6105566b78add1d8622404a3848750b6c062dbf00cf72d655210eab1':
              raise RuntimeError('Patch integrity check failed')
          subprocess.run(['git', '-c', 'core.whitespace=cr-at-eol', 'apply', '--check', '--whitespace=error', '-'], input=patch, check=True)
          subprocess.run(['git', '-c', 'core.whitespace=cr-at-eol', 'apply', '--whitespace=error', '-'], input=patch, check=True)
          pathlib.Path('.github/workflows/dxf-prepare-named-view.yml').unlink()
          PY
          git add netDxf/DxfDocument.cs netDxf/IO/DxfReader.cs netDxf/IO/DxfWriter.cs netDxf/IO/DxfReader.Views.cs netDxf/IO/DxfWriter.Views.cs netDxf/Tables/View.cs netDxf/Tables/ViewFlags.cs netDxf/Tables/ViewRenderMode.cs tests/netDxf.Conformance/RegressionTests.cs tests/netDxf.Conformance/NamedViewTests.cs doc/dxf-conformance/named-views.md .github/workflows/dxf-prepare-named-view.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: implement core named VIEW table read/write support'
          git push origin HEAD:feature/dxf-named-view-core
