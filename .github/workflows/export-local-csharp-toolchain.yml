name: Export isolated local CSharp test toolchain
on:
  push:
    branches: [codex/dxf-local-toolchain-20260925]
    paths: [.github/workflows/export-local-csharp-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select isolated SDK and package directories
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/netdxf-toolchain/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/netdxf-cli-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/netdxf-toolchain/packages" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Restore public build dependencies into a fresh isolated package cache
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/dxf-local-toolchain-20260925
          "$DOTNET_INSTALL_DIR/dotnet" --info > "$RUNNER_TEMP/netdxf-toolchain/dotnet-info.txt"
          "$DOTNET_INSTALL_DIR/dotnet" restore tests/netDxf.Conformance/netDxf.Conformance.csproj --source https://api.nuget.org/v3/index.json
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/netdxf-toolchain/source-commit.txt"
      - name: Archive only the installed public SDK and isolated package cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netdxf-toolchain-export"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'netdxf-toolchain'
          entries=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink():
                  entries.append({'path':path.relative_to(root).as_posix(),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          (root/'contents.json').write_text(json.dumps({'scope':'Public SDK and project restore packages only; no credentials, CLI home, source checkout or runner home','files':entries},indent=2)+'\n')
          PY
          tar -czf "$RUNNER_TEMP/netdxf-toolchain-export/csharp-toolchain.tar.gz" -C "$RUNNER_TEMP/netdxf-toolchain" dotnet packages dotnet-info.txt source-commit.txt contents.json
          cd "$RUNNER_TEMP/netdxf-toolchain-export"
          sha256sum csharp-toolchain.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-csharp-toolchain
          path: ${{ runner.temp }}/netdxf-toolchain-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
