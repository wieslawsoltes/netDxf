name: Prepare tested SPLINE clone preservation
on:
  push:
    branches: [fix/dxf-spline-clone-state]
    paths: [.github/workflows/dxf-prepare-spline-clone.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-spline-clone-state
          fetch-depth: 0
      - name: Verify and apply exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = df6ad87ea5a37c61de43bc7301da26373e926e41
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          packed = b''.join((Path('.github/spline-clone-transfer') / str(i)).read_bytes() for i in range(4))
          assert hashlib.sha256(packed).hexdigest() == 'ee9d761cae799aa7a5d8ca5c388e1c9b7c7ec93e31c6a6c30b3ec141d722bfca'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'dbee99fbc0856195f2ac1b3530f570af5cf0cf023118f337b564efb3773ccb16'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm -r .github/spline-clone-transfer .github/workflows/dxf-prepare-spline-clone.yml
          git add -A
          test "$(git write-tree)" = 1e17d6686d13d493f19b809f0661ccf458b49720
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: clone stored SPLINE geometry without refitting'
          git push origin HEAD:fix/dxf-spline-clone-state
