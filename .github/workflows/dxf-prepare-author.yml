name: Prepare HELIX analytic authoring
on:
  push:
    branches: [feat/dxf-helix-authoring]
    paths: [.github/workflows/dxf-prepare-author.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dxf-helix-authoring
          fetch-depth: 0
      - name: Apply and verify the entire tested source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 19f4dfc48bb1c573bf8ba29c1a98a138efb902f8
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/author-part{i}.txt').read_text() for i in range(5))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ab73c3530f947bd409219f432c3a4849c7089bbee184ce0f1bc24466f669c0cd'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '68188e66a6819aa6e0c94978b48281aea9ddf504a57270743988940b6f15b5f4'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm .github/author-part*.txt .github/workflows/dxf-prepare-author.yml
          git add -A
          test "$(git write-tree)" = 34d5583bd5a27aa297dd4c07e5ee03fcec760bdb
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: author analytic helices with bounded cubic approximation'
          git push origin HEAD:feat/dxf-helix-authoring
