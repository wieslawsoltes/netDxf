name: Prepare Bezier knot correction
on:
  push:
    branches: [fix/dxf-bezier-knot-parameterization]
    paths: [.github/workflows/prepare-bezier.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-bezier-knot-parameterization
          fetch-depth: 0
      - name: Verify and apply exact tested change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = d2c153ff2f33827d33fd9c1897c70c858c25c44c
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          patch = gzip.decompress(Path('.github/bezier-transfer.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '4344654ebdf12c727b7b85c2cb5471d8fb52a65aca0f6afae4842e0c13f2f8e2'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm .github/bezier-transfer.patch.gz .github/workflows/prepare-bezier.yml
          git add -A
          test "$(git write-tree)" = 2a076c9dd31c304425802c02b9c92fb86f462d14
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: parameterize composite Bezier splines with equal knot spans'
          git push origin HEAD:fix/dxf-bezier-knot-parameterization
