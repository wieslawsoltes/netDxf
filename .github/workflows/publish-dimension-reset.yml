name: Publish reviewed dimension reset source
on:
  push:
    branches: [codex/dimension-reset-20260922]
    paths: [.github/workflows/publish-dimension-reset.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply exact reviewed diff and remove publication files
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, pathlib, shutil, subprocess
          folder = pathlib.Path('tools/.dimension-reset-publication')
          parts = sorted(folder.iterdir())
          assert [p.name for p in parts] == [f'{i:03d}' for i in range(10)]
          patch = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == '4382824652fd03bedbed31069d6081d08368daeb260e7e71698a4f194d0b7c8e'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          shutil.rmtree(folder)
          pathlib.Path('.github/workflows/publish-dimension-reset.yml').unlink()
          PY
          git add -A
          test "$(git write-tree)" = '1b8131a119274cc4c75c9aff3a1491c05bab5bc0'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve explicit dimension arrow and fill resets and separate DIMSTYLE flags'
          git push origin HEAD:refs/heads/codex/dimension-reset-20260922
