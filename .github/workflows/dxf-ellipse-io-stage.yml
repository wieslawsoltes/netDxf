name: Apply reviewed ELLIPSE IO source patch
on:
  push:
    branches: ['codex/dxf-ellipse-io-20260921']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/codex/dxf-ellipse-io-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply the fixed source patch, then remove staging files
        shell: bash
        run: |
          set -euo pipefail
          echo '96312bc5b1315e47239c0a8a5868e702588121acb21979c6054aba1714dc655c  .github/ellipse-io-stage.patch' | sha256sum --check
          test "$(git rev-parse HEAD:netDxf/IO/DxfReader.cs)" = c4c0745fb9ff10cc69eb3b17d97abcfc2a659483
          test "$(git rev-parse HEAD:netDxf/IO/DxfWriter.cs)" = 75c3495e5c9da6083e34894c443ce8c72e519816
          test "$(git rev-parse HEAD:tests/netDxf.Conformance/Program.cs)" = 7cdab77e0a3a61ab4603d88ae3be7121e6ce1a89
          git apply --check .github/ellipse-io-stage.patch
          git apply .github/ellipse-io-stage.patch
          git rm .github/ellipse-io-stage.patch .github/workflows/dxf-ellipse-io-stage.yml
          git add netDxf/IO/DxfReader.cs netDxf/IO/DxfWriter.cs tests/netDxf.Conformance/Program.cs
          git diff --cached --check
          test "$(git write-tree)" = 761ca60d3965bffc76e37763791de231266d1b1a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate reviewed ELLIPSE IO codec and remove temporary publishing files'
          git push origin HEAD:refs/heads/codex/dxf-ellipse-io-20260921
