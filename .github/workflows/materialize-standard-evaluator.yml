name: Package local .NET 8 validation toolchain
on:
  push:
    branches: [codex/recover-standard-field-evaluator-20260917]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package only .NET 8 SDK and runtime
        shell: bash
        run: |
          python - "$RUNNER_TEMP/local-dotnet8.tar.gz" <<'PY'
          import pathlib, shutil, sys, tarfile
          root = pathlib.Path(shutil.which('dotnet')).resolve().parent
          choose = lambda values: max(values, key=lambda p: tuple(int(x) for x in p.name.split('.')))
          sdk = choose([p for p in (root / 'sdk').glob('8.*') if p.is_dir()])
          paths = ['dotnet', str(sdk.relative_to(root))]
          for parent in ('host/fxr', 'shared/Microsoft.NETCore.App', 'packs/Microsoft.NETCore.App.Ref', 'packs/Microsoft.NETCore.App.Host.linux-x64', 'packs/Microsoft.AspNetCore.App.Ref', 'shared/Microsoft.AspNetCore.App'):
              versions = [p for p in (root / parent).glob('8.*') if p.is_dir()]
              if versions: paths.append(str(choose(versions).relative_to(root)))
          versions = [p for p in (root / 'packs/NETStandard.Library.Ref').glob('*') if p.is_dir()]
          if versions: paths.append(str(choose(versions).relative_to(root)))
          for filename in ('LICENSE.txt', 'ThirdPartyNotices.txt'):
              if (root / filename).exists(): paths.append(filename)
          with tarfile.open(sys.argv[1], 'w:gz', compresslevel=1) as archive:
              for relative in paths: archive.add(root / relative, arcname=relative)
          print('SDK', sdk.name, 'archive bytes', pathlib.Path(sys.argv[1]).stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: netdxf-local-dotnet8
          path: ${{ runner.temp }}/local-dotnet8.tar.gz
          compression-level: 0
          retention-days: 1
