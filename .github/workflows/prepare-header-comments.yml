name: Apply reviewed HEADER comment correction
on:
  push:
    branches: [fix/dxf-header-comments]
    paths: [.github/workflows/prepare-header-comments.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-header-comments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-header-comments
      - name: Apply locally tested HEADER-scoped changes and check file hashes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('netDxf/IO/DxfReader.cs'); s = p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '82416b5d45d579cd5e5f969e07e8ca5227015ec780998f80ab3316db8cd93e03'
          a = s.index('        private void ReadHeader()'); b = s.index('        private void ReadClasses()', a)
          body = s[a:b]
          assert body.count('this.chunk.Next();') == 49
          body = body.replace('this.chunk.Next();', 'this.ReadNextHeaderTag();')
          helper = '\n'.join([
              '        private void ReadNextHeaderTag()',
              '        {',
              '            // Group 999 comments are transport records, not HEADER values or boundaries.',
              '            // Keep this policy local to semantic HEADER parsing; the low-level reader',
              '            // still exposes comments to consumers that need the original tag stream.',
              '            do',
              '            {',
              '                this.chunk.Next();',
              '            } while (this.chunk.Code == 999);',
              '        }', '', ''])
          p.write_text(s[:a] + body + helper + s[b:])
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '6e7d638a98bffc9ed4fd1d1e6e0344d3a0bddf14f023a514e23749d73fa3aeeb'
          p.write_text(p.read_text().replace('        RegisterCustomHeaderUnicodeTests();', '        RegisterCustomHeaderUnicodeTests();\n        RegisterHeaderCommentTests();'))
          expected = {
              'netDxf/IO/DxfReader.cs': 'd62650a2fb107cc9b6c8d13a0c1ec06d09ff0a55e406aed36168846e52e8a969',
              'tests/netDxf.Conformance/RegressionTests.cs': '3285c195f6039478777512f20856831e7e2a40e4f41bc91b37adf2381dea3566',
              'tests/netDxf.Conformance/HeaderCommentTests.cs': '96ea5298d128538389bb13f898bb5474f957d6cfa3c41384fba7df075d01ad95',
              'doc/dxf-conformance/header-comments.md': 'b070801a7d9542e94bc757b79585ea8084527358df9b6f5bc04ad55566bb97a4'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          Path('.github/workflows/prepare-header-comments.yml').unlink()
      - name: Commit the checked correction to its feature branch only
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add netDxf/IO/DxfReader.cs tests/netDxf.Conformance/RegressionTests.cs .github/workflows/prepare-header-comments.yml
          git commit -m 'fix: ignore comment tags while reading HEADER values'
          git push origin HEAD:fix/dxf-header-comments
