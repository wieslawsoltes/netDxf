name: Publish reviewed tolerance stack escaping
on:
  push:
    branches: [codex/tolerance-stack-escaping-20260923]
    paths: [.github/workflows/publish-stack-escaping.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply fixed reviewed edits and remove publication files
        shell: bash
        run: |
          echo '2949a01d52f16ee1d0ccc551e9a4537826ae35cc9ef0d64eb9ef81b7f86cd60a  tools/_stack-escape.patch' | sha256sum --check
          test "$(git hash-object netDxf/Entities/DimensionBlock.Tolerances.cs)" = '5b6588eb5904ef30bc3c36ee4af17fe22cae0c5d'
          test "$(git hash-object tests/netDxf.Conformance/Program.cs)" = '13ef0d0ae3d812fdddcbc201d9ee820ebba0ff3c'
          test "$(git hash-object tests/netDxf.PackageSmoke/Program.cs)" = 'baeef64d5c6200793107cbff643718cf9dfb0e07'
          git apply --index tools/_stack-escape.patch
          git rm tools/_stack-escape.patch .github/workflows/publish-stack-escaping.yml
          test "$(git write-tree)" = '35d0c99097c2563e3df4516fb90011153d62c413'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Escape tolerance stack literals with the MTEXT character grammar'
          git push origin HEAD:refs/heads/codex/tolerance-stack-escaping-20260923
