name: Commit reconciled JavaScript recovery
on:
  pull_request:
    branches: [netstandard]
    paths: ['.github/js-recovery/**', '.github/workflows/javascript-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/javascript-port'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Commit the integrity-pinned reconciled JavaScript sources
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'PY'
          import hashlib, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD^') != '72e84d05deb9bf6613f98897809b3f9e303202b8':
              raise RuntimeError('Unexpected recovery parent.')
          parts=[pathlib.Path('.github/js-recovery/%02d.part'%i) for i in range(6)]
          packed=b''.join(p.read_bytes() for p in parts)
          if hashlib.sha256(packed).hexdigest() != 'd24d5b30c3eb9e513f08e7670a3e941c24f3288340634302f7d676cd726d481c':
              raise RuntimeError('Recovery transport integrity failure.')
          patch=lzma.decompress(packed)
          if len(patch)!=122379 or hashlib.sha256(patch).hexdigest()!='353cf281a6cfabb0d9461937b142659955c5e9376ae3a04bd84cf7cf4cf50126':
              raise RuntimeError('Recovery patch integrity failure.')
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'reconciled-foundations.patch'
          file.write_bytes(patch)
          git('apply','--check','--index',str(file))
          git('apply','--index','--whitespace=error-all',str(file))
          changed=git('diff','--cached','--name-only').splitlines()
          if len(changed)!=26 or any(not p.startswith('javascript/') for p in changed):
              raise RuntimeError('Unexpected source path in recovery.')
          tree=git('write-tree')
          if git('rev-parse',tree+':javascript')!='2e3cde7a5678c911d75f3bf981eea3fb5681b85c':
              raise RuntimeError('Reconciled sources differ from the tested tree.')
          git('rm','--',*[str(p) for p in parts])
          if git('ls-remote','origin','refs/heads/codex/javascript-port').split()[0]!=os.environ['EXPECTED_HEAD']:
              raise RuntimeError('Branch advanced; no overwrite allowed.')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(js): reconcile saved foundations and recover original raw tests without overwriting newer port')
          git('push','origin','HEAD:refs/heads/codex/javascript-port')
          print('Committed reconciled source:',git('rev-parse','HEAD'))
          PY
