name: JavaScript codec stream parity
on:
  pull_request:
    branches: [netstandard]
    paths: ['javascript/**', '.github/workflows/javascript-codec-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-codec-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  codecs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      NETDXF_SOURCE_ROOT: ${{ github.workspace }}/_oracle
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '3496ab91893a1e4ec9261b4833479f1799149cdc'
          path: _oracle
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build the optional Windows replacement host
        if: runner.os == 'Windows'
        working-directory: javascript
        run: npm run build:windows-host
      - run: node javascript/tools/dotnet.mjs geometry
      - run: node javascript/tools/transport-sections-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/codec-readers-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/codec-writers-differential.mjs
      - if: ${{ !cancelled() }}
        run: node --test javascript/tests/unit/codec-readers.js javascript/tests/unit/codec-writers.js javascript/tests/unit/codec-observation.js javascript/tests/unit/transport-sections.js
      - if: ${{ !cancelled() }}
        run: node javascript/tests/netDxf.Conformance/Program.js
        env:
          DXF_JS_TEST_ARTIFACTS: javascript/artifacts/codec-originals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-codecs-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            javascript/artifacts/transport-sections/${{ matrix.configuration }}/results.json
            javascript/artifacts/codec-readers/${{ matrix.configuration }}/results.json
            javascript/artifacts/codec-writers/${{ matrix.configuration }}/results.json
            javascript/artifacts/codec-originals/results.json
            javascript/artifacts/codec-originals/metadata.json
          if-no-files-found: error
          retention-days: 7
