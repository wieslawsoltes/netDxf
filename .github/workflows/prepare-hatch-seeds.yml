name: Apply reviewed HATCH seed-point support
on:
  push:
    branches: [feature/dxf-hatch-seed-points]
    paths: [.github/workflows/prepare-hatch-seeds.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-hatch-seed-points'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-hatch-seed-points
      - name: Apply exact tested patch and verify whole source tree
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma, os, subprocess
          parts=[Path('.github/patches/hatch-seeds-'+str(i)+'.bin') for i in range(4)]
          data=b''.join(p.read_bytes() for p in parts)+base64.b64decode('AAGcRvCKAgB/RbAmscRn+wIAAAAABFla')
          assert hashlib.sha256(data).hexdigest()=='a3a72836a97119a436cdcf6daf810658b5c0c4aab145f83ca9d23445151e9e8b'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='2ef368cf27805121410f1d3b70020f72ec0d883ee8583cc7cd797915003d3005'
          path=Path(os.environ['RUNNER_TEMP'])/'hatch-seeds.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          for p in parts:p.unlink()
          workflow=Path('.github/workflows/prepare-hatch-seeds.yml');workflow.unlink()
          paths=['netDxf/Entities/Hatch.cs','netDxf/IO/DxfReader.cs','netDxf/IO/DxfWriter.cs','tests/netDxf.Conformance/RegressionTests.cs','tests/netDxf.Conformance/HatchSeedPointTests.cs','tests/netDxf.Conformance/HatchSeedPointApiTests.cs','tools/verify_hatch_seed_points.py','doc/dxf-conformance/hatch-seed-points.md']
          subprocess.run(['git','add',*paths,*[str(p) for p in parts],str(workflow)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='7e73d5ec5e270a0775615b846342c6138466422d'
      - name: Commit only the isolated feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: preserve and edit HATCH seed points with counted input validation'
          git push origin HEAD:feature/dxf-hatch-seed-points
