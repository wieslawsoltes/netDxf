name: JavaScript port
on:
  pull_request:
    branches: [netstandard]
    paths: ['javascript/**', '.github/workflows/javascript-port.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-port-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify committed generated data and package imports
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const baseline = JSON.parse(fs.readFileSync('javascript/baseline.json'));
          const manifest = JSON.parse(fs.readFileSync('javascript/generated-manifest.json'));
          if (manifest.sourceFingerprint !== baseline.sourceFingerprint) throw new Error('Source fingerprint mismatch.');
          for (const entry of manifest.files) {
            const actual = createHash('sha256').update(fs.readFileSync('javascript/'+entry.path)).digest('hex');
            if (actual !== entry.sha256) throw new Error('Generated file changed: '+entry.path);
          }
          const api = await import('./javascript/index.js');
          if (!api.DxfRawDocument || !api.DxfTag) throw new Error('Missing package exports.');
          console.log('Generated integrity and module imports passed. Full parity remains unverified.');
          NODE
      - name: Retain reproducible source checkpoint
        run: |
          mkdir -p artifacts/javascript
          git archive --format=tar.gz --output=artifacts/javascript/source-checkpoint.tar.gz HEAD
          git rev-parse HEAD > artifacts/javascript/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-source-checkpoint
          path: artifacts/javascript
          if-no-files-found: error
          retention-days: 7
