name: Publish reviewed tolerance compatibility source
on:
  push:
    branches: [codex/tolerance-rendering-compat-20260923]
    paths: [.github/workflows/publish-tolerance-compat.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply fixed reviewed patch and remove publishing files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          import hashlib
          import subprocess
          
          root = Path(".dxf-tolerance-publish")
          parts = [root / ("part-%02d" % i) for i in range(5)]
          expected = ["39b4c832da3a352c555496e9307c4bc45a7e539c", "07b2b5425d12697e75e710d0137d4cc619b81c83", "2a26e0f01b84204f07ac19e40180f9e357f12303", "b10647023f952615b46bc50243e46bfb9e3a8b54", "8c7f5d289d240ec35733149025f3dfe8e4585621"]
          for path, wanted in zip(parts, expected):
              assert subprocess.check_output(["git", "hash-object", str(path)], text=True).strip() == wanted, str(path)
          assert subprocess.check_output(["git", "rev-parse", "HEAD^^{tree}"], text=True).strip() == "7d9b34e1884b78c431d2d604eac01bfad105e9e1"
          patch = gzip.decompress(b"".join(path.read_bytes() for path in parts))
          assert len(patch) == 72581
          assert hashlib.sha256(patch).hexdigest() == "1ae385bff2e94e020c36a126dd6bc140b03653b4d3d0a5ef8eef7f345492715f"
          subprocess.run(["git", "apply", "--check", "--index", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--index", "-"], input=patch, check=True)
          subprocess.run(["git", "rm", "-r", ".dxf-tolerance-publish", ".github/workflows/publish-tolerance-compat.yml"], check=True)
          assert subprocess.check_output(["git", "write-tree"], text=True).strip() == "4bc7a5ebffd84ae067d8052ddd01c050a3ce368a"
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render tolerance and limit labels while preserving sparse native settings'
          git push origin HEAD:refs/heads/codex/tolerance-rendering-compat-20260923
