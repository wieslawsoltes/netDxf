name: Prepare isolated value-codec tests
on:
  push:
    branches: [feature/dxf-strict-text-values]
    paths: [.github/workflows/prepare-value-tests.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-strict-text-values'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-strict-text-values
      - name: Apply exact reviewed source edits and verify tested hashes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('netDxf/IO/TextCodeValueReader.cs')
          s = p.read_text()
          assert s.count('using System.Diagnostics;') == 1
          s = s.replace('using System.Diagnostics;\n', '')
          old = '            if (this.code >= 0 && this.code <= 9) // string\n'
          assert s.count(old) == 1
          s = s.replace(old, '''            if (this.code == 5 || this.code == 1005) // object or extended-data handle
                      {
                          return this.ReadHex(valueString);
                      }
          '''.replace('                      ', '            ').replace('                          ', '                ') + old)
          # Restore indentation explicitly; exact hash verification below is mandatory.
          start = s.index('            if (this.code == 5 || this.code == 1005)')
          end = s.index(old, start)
          s = s[:start] + '            if (this.code == 5 || this.code == 1005) // object or extended-data handle\n            {\n                return this.ReadHex(valueString);\n            }\n' + s[end:]
          a = s.index('        //private byte ReadByte(')
          b = s.index('        private byte[] ReadBytes(', a)
          s = s[:a] + s[b:]
          s = s.replace('if (this.code >= 1005 && this.code <= 1009)', 'if (this.code >= 1006 && this.code <= 1009)')
          for typename, method, kind in [('short', 'ReadShort', '16-bit integer'), ('int', 'ReadInt', '32-bit integer'), ('long', 'ReadLong', '64-bit integer')]:
              a = s.index('        private ' + typename + ' ' + method + '(')
              b = s.index('\n        private ', a + 1)
              body = '        private ' + typename + ' ' + method + '(string valueString)\n        {\n'
              body += "            if (valueString.IndexOf('\\0') < 0 &&\n"
              body += '                ' + typename + '.TryParse(valueString, NumberStyles.Integer, CultureInfo.InvariantCulture, out ' + typename + ' result))\n'
              body += '            {\n                return result;\n            }\n            throw this.InvalidValue("' + kind + '");\n        }\n'
              s = s[:a] + body + s[b:]
          a = s.index('        private bool ReadBool(')
          b = s.index('        private string ReadString(', a)
          body = [
              '        private bool ReadBool(string valueString)', '        {',
              "            if (valueString.IndexOf('\\0') < 0 &&",
              '                byte.TryParse(valueString, NumberStyles.Integer, CultureInfo.InvariantCulture, out byte result) && result <= 1)',
              '            {', '                return result == 1;', '            }',
              '            throw this.InvalidValue("boolean (0 or 1)");', '        }', '',
              '        private double ReadDouble(string valueString)', '        {',
              "            if (valueString.IndexOf('\\0') < 0 &&",
              '                double.TryParse(valueString, NumberStyles.Float, CultureInfo.InvariantCulture, out double result) &&',
              '                !double.IsNaN(result) && !double.IsInfinity(result))',
              '            {', '                return result;', '            }',
              '            throw this.InvalidValue("finite double-precision number");', '        }', '', ''
          ]
          s = s[:a] + '\n'.join(body) + s[b:]
          a = s.index('        private string ReadHex(')
          b = s.index('        #endregion', a)
          body = [
              '        private string ReadHex(string valueString)', '        {',
              '            // A handle is an unsigned value with at most sixteen ASCII hexadecimal',
              '            // digits. Do not let integer parsing accept a sign, prefix or trailing NUL.',
              '            int start = 0;', '            int end = valueString.Length;',
              '            while (start < end && char.IsWhiteSpace(valueString[start])) start++;',
              '            while (end > start && char.IsWhiteSpace(valueString[end - 1])) end--;',
              '            if (end == start || end - start > 16)', '            {',
              '                throw this.InvalidValue("hexadecimal handle (1 to 16 digits)");', '            }', '',
              '            ulong result = 0;', '            for (int i = start; i < end; i++)', '            {',
              '                int digit = HexDigit(valueString[i]);', '                if (digit < 0)', '                {',
              '                    throw this.InvalidValue("hexadecimal handle (1 to 16 digits)");', '                }',
              '                result = (result << 4) | (uint) digit;', '            }',
              '            return result.ToString("X", CultureInfo.InvariantCulture);', '        }', '',
              '        private FormatException InvalidValue(string kind)', '        {',
              '            // Avoid echoing arbitrary, possibly very large input into diagnostics.',
              '            return new FormatException(string.Format(CultureInfo.InvariantCulture,',
              '                "Invalid {0} value for group code {1} at line {2}.", kind, this.code, this.currentPosition + 1));',
              '        }', '', ''
          ]
          s = s[:a] + '\n'.join(body) + s[b:]
          assert hashlib.sha256(s.encode()).hexdigest() == '2e1c7eb785742f7a0dfd680541c39b70accd1e0a70c791a589ce1c96d9eeab9e'
          p.write_text(s)
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          s = p.read_text().replace('        RegisterHeaderProbeTests();', '        RegisterHeaderProbeTests();\n        RegisterStrictTextValueTests();')
          assert hashlib.sha256(s.encode()).hexdigest() == '70f842c8533b5d520b60299d874a0097a53d7a3bf876f20c929c2df3c3df79c3'
          p.write_text(s)
          assert hashlib.sha256(Path('tests/netDxf.Conformance/StrictTextValueTests.cs').read_bytes()).hexdigest() == 'a6f7d51cf56787493768539150f4f23ae5d74814fd6355a3e83890edda5721cd'
          Path('.github/workflows/prepare-value-tests.yml').unlink()
      - name: Commit only this feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add netDxf/IO/TextCodeValueReader.cs tests/netDxf.Conformance/RegressionTests.cs .github/workflows/prepare-value-tests.yml
          git commit -m 'fix: reject malformed text DXF values instead of fabricating defaults'
          git push origin HEAD:feature/dxf-strict-text-values
