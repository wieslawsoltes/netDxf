name: Apply reviewed raster ownership correction
on:
  push:
    branches: [codex/dxf-raster-owner]
    paths: [.github/workflows/prepare-raster-owner.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/codex/dxf-raster-owner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dxf-raster-owner
      - name: Apply the reviewed owner and test-registration edits
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('netDxf/IO/DxfWriter.cs')
          data = p.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '952333bc7e7c8712b5c23ed9a2b02e55d78720596fbad1bc991102596f55afbe'
          before = b'this.WriteRasterVariables(this.doc.RasterVariables, imageDefDictionary.Handle);'
          assert data.count(before) == 1
          p.write_bytes(data.replace(before, b'this.WriteRasterVariables(this.doc.RasterVariables, namedObjectDictionary.Handle);'))
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '6ece2914c404251befdee6f390f5378ca7046cfd6e80dcc844e304449ed65aba'
          p.write_text(p.read_text().replace('        RegisterMTextBackgroundTests();', '        RegisterMTextBackgroundTests();\n        RegisterRasterOwnershipTests();'))
          expected = {
              'netDxf/IO/DxfWriter.cs': '24856cbff312401b9329457856117c381e3dfaf290e36b67d74d455054adeab7',
              'tests/netDxf.Conformance/RegressionTests.cs': '034d5476adeaae19480c571500c0acac2317ab91827b629c962989f5dbcca149',
              'tests/netDxf.Conformance/RasterOwnershipTests.cs': '21d6ba339ba729ac3e8422d2920ad04c26ef983b3ec138f669490e302b6b1547',
              'tools/verify_raster_ownership.py': '0d2ba53570e8a59b21d5f2f6f275c6620b041a4f3b59513256a10e106d746dea',
              'doc/dxf-conformance/raster-ownership.md': 'a42ecb503af030b03b791f741b6392c8d4424d4e4d68d2544fdc2b134c51ba06'
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          Path('.github/workflows/prepare-raster-owner.yml').unlink()
      - name: Commit only the checked correction to its feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add netDxf/IO/DxfWriter.cs tests/netDxf.Conformance/RegressionTests.cs .github/workflows/prepare-raster-owner.yml
          git commit -m 'fix: assign raster variables to the named object dictionary'
          git push origin HEAD:codex/dxf-raster-owner
