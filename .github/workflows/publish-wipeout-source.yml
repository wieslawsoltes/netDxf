name: Publish reviewed WIPEOUT source
on:
  push:
    branches: [codex/dxf-wipeout-affine-20260924]
    paths: [.github/workflows/publish-wipeout-source.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact committed edits and publish source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = '1c03b2e096c69d242009ed473b4d718b9741dba2'
          test "$(git rev-parse 'HEAD~1^{tree}')" = 'b438687ed37f589976842210b91f311e68e108a4'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma, os
          data = Path('tools/wipeout-source.diff.xz').read_bytes()
          assert len(data) == 11888
          assert hashlib.sha256(data).hexdigest() == '2e8ead628db682de303345b8203ba52a85231c237824314a5af9ede03be19eb7'
          patch = lzma.decompress(data, memlimit=268435456)
          assert len(patch) == 42123
          assert hashlib.sha256(patch).hexdigest() == '883382a3b401283f56df5fdfb1c15ae84b2065a81a0e4d6335bebbed47d1de59'
          Path(os.environ['RUNNER_TEMP'], 'wipeout.diff').write_bytes(patch)
          PY
          git config core.autocrlf false
          git apply --check "$RUNNER_TEMP/wipeout.diff"
          git apply --index "$RUNNER_TEMP/wipeout.diff"
          test -z "$(git diff --cached -- .github/workflows)"
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/wipeout.index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/wipeout.index"
          git update-index --force-remove .github/workflows/publish-wipeout-source.yml tools/wipeout-source.diff.xz
          test "$(git write-tree)" = '58c0260f29ab7638841a88c7f0a9d409c3843807'
          unset GIT_INDEX_FILE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve WIPEOUT clipping geometry through affine transforms and raster-basis loading'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/codex/dxf-wipeout-affine-20260924
