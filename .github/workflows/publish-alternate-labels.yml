name: Publish reviewed alternate labels
on:
  push:
    branches: [codex/dxf-alternate-labels-20260922]
    paths: [.github/workflows/publish-alternate-labels.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact reviewed source edits and remove publishing files
        shell: bash
        run: |
          echo '2775cde21a910c2a2e062c9d8ac1d806196e5cca57c4ca563eb0df58159a5c07  tools/_publish_alternate_labels.py' | sha256sum --check
          python3 tools/_publish_alternate_labels.py
          git add netDxf tests/netDxf.Conformance tools doc/dxf-conformance .github/workflows
          test "$(git write-tree)" = '0b6a93c027e81171eed515bda9b0776d5ec8caaa'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render alternate dimension labels with effective overrides and independent rounding'
          git push origin HEAD:refs/heads/codex/dxf-alternate-labels-20260922
