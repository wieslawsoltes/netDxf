name: Publish verified dimension-fill source
on:
  push:
    branches: [codex/dxf-text-fill-20260923]
    paths: [.github/workflows/publish-dimension-fill.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reconstruct the verified plain diff and publish its exact source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, subprocess
          paths = [f'tools/.dimension-fill-{i}' for i in range(5)]
          expected = ['e8391ef4ebcf89ee62074a576db17275ae9357ee', 'de786f4a00f1b7b52a5023428636c09508f0ca9f', '30f2e97b929c02c64cc382103c0800062a0c1fd0', 'ed6ed1053c851ce59e5c3479d5510c239f122409', '32954af8ccf2e8f814f2f5b71ebb0c7492a99543']
          for path, sha in zip(paths, expected):
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha
          patch = gzip.decompress(b''.join(Path(path).read_bytes() for path in paths))
          assert len(patch) == 33076
          assert hashlib.sha256(patch).hexdigest() == 'c3ce0aa03242324a6329b3f86fe99e43cbb3b86536ff578e268939bef62e72e5'
          subprocess.run(['git', 'rm', '--', *paths, '.github/workflows/publish-dimension-fill.yml'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'd14febdc7f9ce6dbbf8caf1beaa6d12ef2d914d2'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'c65fee0e40c79a0a038a5ddeb4f23182e9f2c1c5'
          PY
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate dimension label masks with indexed inheritance, explicit resets and profile context'
          git push origin HEAD:refs/heads/codex/dxf-text-fill-20260923
