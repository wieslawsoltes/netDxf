name: Materialize checked primitive geometry review
on:
  push:
    branches: [codex/materialize-primitives-20260917]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize only the verified reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cp .continuation-primitives/changes.b64 "$RUNNER_TEMP/primitives.b64"
          python - "$RUNNER_TEMP" <<'PY'
          import base64, gzip, hashlib, pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          encoded = (folder / 'primitives.b64').read_text().strip()
          # Correct transport transcription only. The originally reviewed decoded
          # patch hash and resulting full source tree remain the acceptance gates.
          fixes = [(379,380,'d',''),(425,428,'UDj','z'),(534,536,'1L','l'),(1850,1851,'8',''),(2437,2438,'t','r'),(3045,3048,'duH','S'),(4017,4019,'e4','i2'),(4383,4384,'6','9'),(4411,4412,'S',''),(5758,5761,'4O2','0c'),(6605,6606,'Z',''),(7887,7888,'U','')]
          for start, end, before, after in reversed(fixes):
              assert encoded[start:end] == before
              encoded = encoded[:start] + after + encoded[end:]
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 46751
          assert hashlib.sha256(patch).hexdigest() == 'ef9ca3f420839ac030c71865c08708edbb220d20709119dc2814e2bb27d9ca4b'
          (folder / 'primitives.patch').write_bytes(patch)
          PY
          git config core.autocrlf false
          git switch --detach 730944c59196c6a556cedc4943acad9108d7f8ed
          test "$(git rev-parse HEAD^{tree})" = c127fd8d1f4f25ca81aea529e968927d1fd066b3
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/primitives.patch"
          test "$(git write-tree)" = cbfb6f0f468c776c23b417e6cf80054c1e076f20
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Review eight primitive geometry families with atomic affine transforms and stable directions'
          test "$(git rev-parse HEAD^)" = 730944c59196c6a556cedc4943acad9108d7f8ed
          test -z "$(git ls-tree --name-only HEAD .continuation-primitives .github/workflows/materialize-primitives.yml)"
          test -z "$(git ls-remote --heads origin codex/dxf-primitive-review-20260917)"
          git push origin HEAD:refs/heads/codex/dxf-primitive-review-20260917
          git show --no-patch --format=fuller HEAD
          git rev-parse HEAD^{tree}
