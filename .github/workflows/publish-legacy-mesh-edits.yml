name: Publish exact legacy mesh edit source
on:
  push:
    branches: [codex/dxf-legacy-mesh-edits-20260925]
    paths: [.github/workflows/publish-legacy-mesh-edits.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply fixed integration edits and require exact committed source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/dxf-legacy-mesh-edits-20260925
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          def edit(path,old,new,count=1):
           p=root/path;b=p.read_bytes();a=old.encode();z=new.encode();assert b.count(a)==count,(path,b.count(a));p.write_bytes(b.replace(a,z))
          p='netDxf/Entities/PolygonMesh.cs'
          edit(p,'        public Vector3[] Vertexes\n','        /// <remarks>Direct array edits cannot invalidate cached graphics. Use SetVertex for explicit edits.</remarks>\n        public Vector3[] Vertexes\n')
          edit(p,'        /// <param name="vertex">A Vector3.</param>\n','        /// <param name="vertex">A finite replacement position.</param>\n        /// <remarks>Out-of-range indices retain the historical no-op behavior. A valid edit preserves\n        /// retained VERTEX identity and metadata, and clears parent proxy graphics only when coordinate\n        /// bits change. Other grid points and surface admission are not modified or revalidated.</remarks>\n')
          edit(p,'                this.vertexes[i0 + this.u * i1] = vertex;\n','''                if (double.IsNaN(vertex.X) || double.IsInfinity(vertex.X)
                              || double.IsNaN(vertex.Y) || double.IsInfinity(vertex.Y)
                              || double.IsNaN(vertex.Z) || double.IsInfinity(vertex.Z))
                              throw new ArgumentException("Polygon mesh coordinates must be finite.", nameof(vertex));
                          int index = i0 + this.u * i1;
                          Vector3 previous = this.vertexes[index];
                          if (!PrimitiveGeometryMutation.Assign(ref previous, vertex)) return;
                          this.vertexes[index] = vertex;
                          this.ClearProxyGraphics();
          ''')
          for axis in ('U','V'):
           edit(p,f'                this.density{axis} = value;\n',f'                if (this.density{axis} == value) return;\n                this.density{axis} = value;\n                this.ClearProxyGraphics();\n')
          edit(p,'                if (value)\n','                PolylineTypeFlags before = this.flags;\n                if (value)\n',2)
          for flag in ('ClosedPolylineOrClosedPolygonMeshInM','ClosedPolygonMeshInN'):
           old='                    this.flags &= ~PolylineTypeFlags.'+flag+';\n                }\n';edit(p,old,old+'                if (this.flags != before) this.ClearProxyGraphics();\n')
          edit(p,'                if (value == PolylineSmoothType.NoSmooth)\n','                PolylineTypeFlags beforeFlags = this.flags;\n                PolylineSmoothType beforeType = this.smoothType;\n                if (value == PolylineSmoothType.NoSmooth)\n')
          edit(p,'                this.smoothType = value;\n','                this.smoothType = value;\n                if (this.flags != beforeFlags || value != beforeType) this.ClearProxyGraphics();\n')
          p='netDxf/Entities/PolyfaceMesh.cs'
          edit(p,'        public Vector3[] Vertexes\r\n','        /// <remarks>Direct array edits cannot invalidate cached graphics. Use SetVertex for validated explicit edits.</remarks>\r\n        public Vector3[] Vertexes\r\n')
          p='netDxf/Entities/PolygonMesh.cs'
          edit(p,'        /// <remarks>Valid values range from 3 to 201.</remarks>', '        /// <remarks>Public assignments require 3 through 201. Ordinary unsmoothed source meshes may\n        /// retain other stored signed-short hints, including the absent-field default zero.</remarks>', 2)
          edit(p, '        // Used before sampling and before writer preprocessing allocates child handles.\n', '        // Ordinary mesh source hints are stored signed shorts, not active tessellation counts.\n        // Restore without public authoring-range checks or treating hydration as an edit.\n        internal void RestoreSurfaceDensities(short densityU, short densityV)\n        {\n            this.densityU = densityU;\n            this.densityV = densityV;\n        }\n\n        // Used before sampling and before writer preprocessing allocates child handles.\n')
          p='netDxf/IO/DxfReader.cs'
          edit(p, '            short densityN = 0;\n', '            short densityN = 0;\n            short storedDensityM = 0, storedDensityN = 0;\n')
          for axis in ['M','N']:
           edit(p, f'                        density{axis} = this.chunk.ReadShort();\n', f'                        density{axis} = this.chunk.ReadShort();\n                        storedDensity{axis} = density{axis};\n')
          edit(p, 'this.ReadStoredPolygonMeshSequence(flags, normal, xData, m, n);', 'this.ReadStoredPolygonMeshSequence(flags, normal, xData, m, n, storedDensityM, storedDensityN);')
          p='netDxf/IO/DxfReader.PolygonMeshRecords.cs'
          edit(p, 'List<XData> xdata, short m, short n)', 'List<XData> xdata, short m, short n, short densityM, short densityN)')
          edit(p, '            result.XData.AddRange(xdata); result.SetStoredRecords(this.doc, slots, end);', '            result.RestoreSurfaceDensities(densityM, densityN);\n            result.XData.AddRange(xdata); result.SetStoredRecords(this.doc, slots, end);')
          p='netDxf/IO/DxfWriter.cs'
          edit(p, '                    StoredMeshSource = pMesh', '                    DensityM = pMesh.DensityU, DensityN = pMesh.DensityV,\n                    StoredMeshSource = pMesh')
          edit(p, '                DensityM = precisionU,\n                DensityN = precisionV', '                DensityM = pMesh.SmoothType == PolylineSmoothType.NoSmooth ? pMesh.DensityU : precisionU,\n                DensityN = pMesh.SmoothType == PolylineSmoothType.NoSmooth ? pMesh.DensityV : precisionV')
          edit('tests/netDxf.Conformance/Program.cs', '        RegisterPolyline3DEditTests();\n', '        RegisterPolyline3DEditTests();\n        RegisterLegacyMeshEditTests();\n')
          edit('tests/netDxf.PackageSmoke/Program.cs', 'NetDxf.Qualification.Polyline3DEditCases.VerifyInstalled();\n', 'NetDxf.Qualification.Polyline3DEditCases.VerifyInstalled();\nNetDxf.Qualification.LegacyMeshEditCases.VerifyInstalled();\n')
          for name in ['netDxf.Conformance','netDxf.PackageSmoke','netDxf.TargetSmoke']:
           old='    <Compile Include="../shared/Polyline3DEditCases.cs" Link="Polyline3DEditCases.cs" />\n'
           edit('tests/'+name+'/'+name+'.csproj', old, old+'    <Compile Include="../shared/LegacyMeshEditCases.cs" Link="LegacyMeshEditCases.cs" />\n')
          edit('tests/netDxf.Conformance/PolygonMeshConversionTests.cs', '            if (explicitDensity) { mesh.DensityU = 5; mesh.DensityV = 7; }', '            if (explicitDensity)\n            {\n                mesh.DensityU = 5; mesh.DensityV = 7;\n                // Seed the conversion-preservation fixture after its final geometry/hint edit.\n                // Explicit edits invalidate stale graphics; conversion must retain these fresh bytes.\n                mesh.ProxyGraphics = new byte[] { 2, 3, 5 };\n            }')
          PY
          git add netDxf/Entities/PolygonMesh.cs netDxf/Entities/PolyfaceMesh.cs netDxf/IO/DxfReader.cs netDxf/IO/DxfWriter.cs netDxf/IO/DxfReader.PolygonMeshRecords.cs tests/netDxf.Conformance/Program.cs tests/netDxf.Conformance/netDxf.Conformance.csproj tests/netDxf.Conformance/PolygonMeshConversionTests.cs tests/netDxf.PackageSmoke/Program.cs tests/netDxf.PackageSmoke/netDxf.PackageSmoke.csproj tests/netDxf.TargetSmoke/netDxf.TargetSmoke.csproj
          git update-index --force-remove .github/workflows/publish-legacy-mesh-edits.yml
          test "$(git write-tree)" = 3c52ba8e35d694179ac117aaba9381b003108eba
          git reset HEAD -- .github/workflows/publish-legacy-mesh-edits.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Integrate legacy mesh fidelity and complete shared regression coverage'
          git push origin HEAD:refs/heads/codex/dxf-legacy-mesh-edits-20260925
