name: Apply verified HATCH closure correction
on:
  push:
    branches: [fix/dxf-hatch-polyline-closure]
    paths: [.github/workflows/prepare-hatch-closure.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-hatch-polyline-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-hatch-polyline-closure
      - name: Verify the complete patch and tested tree
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, os, subprocess
          payload=Path('.github/patches/hatch-closure.gz')
          encoded=base64.b64encode(payload.read_bytes()).decode()
          # Repair the recorded transcription insertion; require the canonical hash before use.
          assert encoded.count('pdbGG565') == 1
          data=base64.b64decode(encoded.replace('pdbGG565','pdbG565'),validate=True)
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == '7615541c08ae1809922ce9d90cbb8880e8debf8f'
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '404fbf6f7c70a8a3de933b6ea05b19825735a02b9fe0d56e309c772d0649832f'
          path=Path(os.environ['RUNNER_TEMP'])/'closure.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          payload.unlink()
          workflow=Path('.github/workflows/prepare-hatch-closure.yml');workflow.unlink()
          paths=['netDxf/Entities/HatchBoundaryPath.cs','netDxf/IO/DxfReader.cs','tests/netDxf.Conformance/HatchPolylineClosureTests.cs','tests/netDxf.Conformance/RegressionTests.cs','tools/verify_hatch_polyline_closure.py','doc/dxf-conformance/hatch-polyline-closure.md']
          subprocess.run(['git','add',*paths,str(payload),str(workflow)],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == '54229d95fee12ac8ca5e6e2748be76dec47c7b8e'
      - name: Commit only the isolated feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: retain HATCH polyline closure through load and clone'
          git push origin HEAD:fix/dxf-hatch-polyline-closure
