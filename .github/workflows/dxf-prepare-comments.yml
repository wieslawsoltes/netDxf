name: Prepare tested typed comment handling
on:
  push:
    branches: [fix/dxf-typed-comment-handling]
    paths: [.github/workflows/dxf-prepare-comments.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-typed-comment-handling
          fetch-depth: 0
      - name: Verify and apply exact tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 78857600b444972f47d3ccdd53a7f8001d74cc8d
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          packed = b''.join((Path('.github/comments-transfer') / str(i)).read_bytes() for i in range(5))
          assert hashlib.sha256(packed).hexdigest() == 'a3c0b80b1713f0383af4bb731713a7563bc87f2ed4706f05c95b1a51059d1603'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '958bb0f701e6c1c7681e1ed15f9a99baf02509cee8ea15c6d771c2052821223a'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm -r .github/comments-transfer .github/workflows/dxf-prepare-comments.yml
          git add -A
          test "$(git write-tree)" = 5532be0efaba6effef8856e1676f45a5b6aae16d
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: ignore ASCII comments consistently in typed DXF parsing'
          git push origin HEAD:fix/dxf-typed-comment-handling
