name: Apply checked MESH reader validation
on:
  push:
    branches: [fix/dxf-mesh-read-validation]
    paths: [.github/workflows/prepare-mesh-read-validation.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-mesh-read-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-mesh-read-validation
      - name: Verify complete patch and source tree
        shell: python
        run: |
          from pathlib import Path
          import gzip, hashlib, os, subprocess
          payload=Path('.github/patches/mesh-read-validation.gz')
          patch=gzip.decompress(payload.read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='f2f5b987e37a482151aad8a2b4d917c13a76397ee89dc7f16e4b2ad165ebb148'
          path=Path(os.environ['RUNNER_TEMP'])/'mesh-read.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          payload.unlink()
          Path('.github/workflows/prepare-mesh-read-validation.yml').unlink()
          subprocess.run(['git','add','netDxf/IO/DxfReader.cs','tests/netDxf.Conformance/MeshReadValidationTests.cs','tests/netDxf.Conformance/RegressionTests.cs','doc/dxf-conformance/mesh-read-validation.md','tools/verify_mesh_read_validation.py','.github/patches/mesh-read-validation.gz','.github/workflows/prepare-mesh-read-validation.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='1a524a3aa8347e9188ba37516cd7f2c849ff56d9'
      - name: Commit only the isolated feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: validate counted MESH input without trusting allocation sizes'
          git push origin HEAD:fix/dxf-mesh-read-validation
