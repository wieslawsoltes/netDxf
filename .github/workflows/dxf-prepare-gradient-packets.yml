name: Prepare gradient packet parser
on:
  push:
    branches: [fix/dxf-hatch-gradient-packets]
    paths: [.github/workflows/dxf-prepare-gradient-packets.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-hatch-gradient-packets
      - name: Apply hash-verified patch and verify complete final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          payload = ''
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '14ec219af3ee85b174016e73748638e592a25ff243c883d8f17d415cb7b41b91'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/workflows/dxf-prepare-gradient-packets.yml
          test "$(git write-tree)" = ff227d3af1dde2be53e6b0d322469d5b5800b289
          git config user.name 'netDxf conformance'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: dispatch and validate HATCH gradient fields without positional reads'
          git push origin HEAD:fix/dxf-hatch-gradient-packets
