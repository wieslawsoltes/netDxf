name: Shadow Studio Pages

on:
  push:
    branches: [netstandard]
    paths:
      - 'shadow/**'
      - 'netDxf/**'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/global.json'
      - '**/[Nn][Uu][Gg][Ee][Tt].[Cc]onfig'
      - 'tools/ci/shadow_studio*'
      - 'tests/shadow_pages/**'
      - '.github/workflows/shadow-studio-pages.yml'
  pull_request:
    branches: [netstandard]
    paths:
      - 'shadow/**'
      - 'netDxf/**'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/global.json'
      - '**/[Nn][Uu][Gg][Ee][Tt].[Cc]onfig'
      - 'tools/ci/shadow_studio*'
      - 'tests/shadow_pages/**'
      - '.github/workflows/shadow-studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-studio-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and verify standalone Blazor Studio
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check server-to-browser route parity
        run: python tools/ci/shadow_studio_browser.py --check-source
      - name: Install native WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Publish the complete browser application
        # Keep dependency framework selections; only the browser targets .NET 10.
        run: >-
          dotnet publish shadow/samples/netDxf.Shadow.Studio.Browser/netDxf.Shadow.Studio.Browser.csproj
          -c Release -f net10.0 -p:NoWarn=1591
          -p:ContinuousIntegrationBuild=true
          -o artifacts/shadow-studio-browser
      - name: Validate and prepare GitHub Pages assets
        run: python tools/ci/shadow_studio_browser.py --published artifacts/shadow-studio-browser/wwwroot
      - name: Install real browser verification dependencies
        run: |
          python -m pip install playwright==1.57.0 ezdxf==1.4.4
          python -m playwright install --with-deps chromium
      - name: Verify browser-only CAD at the root and repository subpath
        run: python shadow/tests/blazor_studio_browser.py --published artifacts/shadow-studio-browser/wwwroot
      - name: Verify all sample layouts and explicit browser fonts
        run: python shadow/tests/blazor_capabilities_browser.py --published artifacts/shadow-studio-browser/wwwroot
      - name: Retain browser diagnostics and published app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-studio-browser-validation
          path: |
            artifacts/blazor-browser/
            artifacts/shadow-studio-browser/wwwroot/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload interactive Pages application
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/shadow-studio-browser/wwwroot
      - name: Describe validated deployment
        run: |
          echo '### Shadow Studio — Blazor WebAssembly' >> "$GITHUB_STEP_SUMMARY"
          echo 'Interactive CAD and diagnostics execute .NET, SkiaSharp and HarfBuzz in the browser.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated on a static-only server, at / and /netDxf/. No ASP.NET service is deployed.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy interactive Studio to GitHub Pages
    if: github.ref == 'refs/heads/netstandard' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
