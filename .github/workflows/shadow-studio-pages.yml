name: Shadow Studio Pages

on:
  push:
    branches: [netstandard]
    paths:
      - 'shadow/**'
      - 'netDxf/**'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/global.json'
      - '**/[Nn][Uu][Gg][Ee][Tt].[Cc]onfig'
      - 'tools/ci/shadow_studio_pages.py'
      - 'tests/shadow_pages/**'
      - '.github/workflows/shadow-studio-pages.yml'
  pull_request:
    branches: [netstandard]
    paths:
      - 'shadow/**'
      - 'netDxf/**'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/global.json'
      - '**/[Nn][Uu][Gg][Ee][Tt].[Cc]onfig'
      - 'tools/ci/shadow_studio_pages.py'
      - 'tests/shadow_pages/**'
      - '.github/workflows/shadow-studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-studio-pages-${{ github.event.pull_request.number || github.ref }}
  # Do not interrupt an in-progress production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and validate static Studio gallery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test Pages exporter
        run: python -m unittest discover -s tests/shadow_pages -p 'test_*.py' -v
      - name: Install native text rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1 fonts-dejavu-core fonts-liberation
      - name: Publish the existing ASP.NET Studio for build-time rendering
        run: >-
          dotnet publish shadow/samples/netDxf.Shadow.Studio/netDxf.Shadow.Studio.csproj
          -c Release -p:TargetFrameworks=net8.0 -p:NoWarn=1591
          -p:ContinuousIntegrationBuild=true --self-contained false
          -o artifacts/shadow-studio-host
      - name: Render every layout to an API-free static site
        # This starts Studio only on loopback and stops it after the export.
        # Publishing wwwroot directly would break: Pages cannot host ASP.NET.
        run: >-
          python tools/ci/shadow_studio_pages.py
          --published artifacts/shadow-studio-host
          --output artifacts/shadow-studio-pages
      - name: Retain Studio startup/render diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-studio-pages-diagnostics
          path: artifacts/shadow-studio-pages.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/shadow-studio-pages
      - name: Describe the deployment boundary
        run: |
          echo '### Shadow Studio Pages' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated read-only PNG/SVG gallery generated by the actual Studio host.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The full editor still requires the local ASP.NET host; no server binaries are published to Pages.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Studio preview to GitHub Pages
    if: github.ref == 'refs/heads/netstandard' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time repository setting: Settings > Pages > Source > GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
