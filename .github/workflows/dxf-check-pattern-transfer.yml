name: Publish verified pattern ordering source
on:
  push:
    branches: [fix/dxf-hatch-pattern-order]
    paths: [.github/workflows/dxf-check-pattern-transfer.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify payload and exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code ad2ad829b804644223cd7bd8902d7d837be119c7 HEAD -- . ':(exclude).github/workflows/dxf-prepare-pattern-order.yml' ':(exclude).github/workflows/dxf-check-pattern-transfer.yml'
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re
          source = pathlib.Path('.github/workflows/dxf-prepare-pattern-order.yml').read_text()
          encoded = re.search("encoded = '''(.*?)'''", source, re.S).group(1)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '2416ee39487efd05277add6d9bc6bf608ca523fdec411e830e3c42ee0256147b'
          # Two omitted transfer fragments were identified against the local original.
          encoded = encoded[:6884] + 'Q' + encoded[6884:]
          encoded = encoded[:418] + 'ZkMup2e86gNz1wpsNB1xl0XWdv78CdjO1xbzSZzT5Y4u21F4sIJu8FsUiuXYEIXLjwV5D4K1jAreuHC5jUJFwGjh2tzKlvx7E386Y882kIC5ziT0PYvi+8BOHNvTiJqEFMiMC7t4CXmQcIxfV/+aU4BeRME3ocLxeLMEpgGCAGdJwm2OYtTAcp40YA0Qa04vJsbDWPwuVCjEfC5knHiR0lIpwJGx65rrNK6RIv' + encoded[418:]
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'ef4c87d4caa8316620f7a9ee2ada99aa451b7c5e498a083b6d69280977daa7cc'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '6fd7741c82802771df45623aa991136175fe3db7731bf8ab8f9925ddfdb0026f'
          pathlib.Path('/tmp/pattern-order.patch').write_bytes(patch)
          PY
          git apply --check /tmp/pattern-order.patch
          git apply /tmp/pattern-order.patch
          git rm .github/workflows/dxf-prepare-pattern-order.yml .github/workflows/dxf-check-pattern-transfer.yml
          git add -A
          test "$(git write-tree)" = ea88037d8ab3d5b2ad9c8639b217deee5315548a
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resolve HATCH pattern metadata before coordinate conversion'
          git push origin HEAD:fix/dxf-hatch-pattern-order
