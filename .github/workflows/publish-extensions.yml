name: Publish reviewed extension geometry
on:
  push:
    branches: [codex/extension-lines-20260923]
    paths: [.github/workflows/publish-extensions.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply counted edits and require the reviewed final source
        shell: bash
        run: |
          echo 'c427eec14a546b0b38182eefe454dbb82862ba458e24da87575713163c0cac43  tools/_publish_extensions.py' | sha256sum --check
          python tools/_publish_extensions.py
          git add netDxf tests tools doc .github/workflows
          test "$(git write-tree)" = '2c4a3892c95f5532339e1906895afa5c277aa803'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate fixed-length dimension extensions and correct side-specific geometry and linetypes'
          git push origin HEAD:refs/heads/codex/extension-lines-20260923
