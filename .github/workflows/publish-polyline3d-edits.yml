name: Publish exact Polyline3D edit source
on:
  push:
    branches: [codex/dxf-polyline3d-edits-20260925]
    paths: [.github/workflows/publish-polyline3d-edits.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'wieslawsoltes/netDxf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply fixed integration edits and require the locally committed source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/dxf-polyline3d-edits-20260925
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); b=p.read_bytes(); old=old.encode(); new=new.encode()
              assert b.count(old)==count, (path, old, b.count(old))
              p.write_bytes(b.replace(old,new))
          p='netDxf/Entities/Polyline3D.cs'
          replace(p, '        public List<Vector3> Vertexes\n', '        /// <remarks>Direct list edits do not notify the entity. Use SetVertex and the explicit topology methods\n        /// to validate retained record state and invalidate stale parent proxy graphics.</remarks>\n        public List<Vector3> Vertexes\n')
          replace(p, '                if (value)\n', '                PolylineTypeFlags before = this.flags;\n                if (value)\n', 2)
          for flag in ['ClosedPolylineOrClosedPolygonMeshInM', 'ContinuousLinetypePattern']:
              old='                    this.flags &= ~PolylineTypeFlags.'+flag+';\n                }\n'
              replace(p, old, old+'                if (this.flags != before) this.ClearProxyGraphics();\n')
          replace(p, '                if (value == PolylineSmoothType.NoSmooth)\n', '                PolylineTypeFlags beforeFlags = this.flags;\n                PolylineSmoothType beforeType = this.smoothType;\n                if (value == PolylineSmoothType.NoSmooth)\n')
          replace(p, '                this.smoothType = value;\n', '                this.smoothType = value;\n                if (beforeFlags != this.flags || beforeType != value) this.ClearProxyGraphics();\n')
          replace(p, '            if (this.HasStoredRecords) this.storedVertexRecords.Reverse();\n', '            if (this.HasStoredRecords) this.storedVertexRecords.Reverse();\n            this.ClearProxyGraphics();\n')
          p='netDxf/Entities/Polyline3D.Topology.cs'
          method='''        /// <summary>Replaces a point while preserving its retained VERTEX identity and metadata.</summary>
                  /// <param name="index">The zero-based index of the point to replace.</param>
                  /// <param name="position">The finite replacement position.</param>
                  /// <remarks>
                  /// Retained sequences require a registered parent in their source document and an unchanged
                  /// count and smoothing mode, just like the topology methods. The complete existing sequence
                  /// is validated before assignment. No handle is allocated. Exact coordinate bits determine
                  /// whether parent proxy graphics are invalidated, including the sign of zero.
                  /// </remarks>
                  public void SetVertex(int index, Vector3 position)
                  {
                      if (index < 0 || index >= this.vertexes.Count) throw new ArgumentOutOfRangeException(nameof(index));
                      ValidateTopologyPosition(position, nameof(position));
                      this.ValidateTopologyEdit();
                      Vector3 previous = this.vertexes[index];
                      bool changed = PrimitiveGeometryMutation.Assign(ref previous, position);
                      this.vertexes[index] = position;
                      if (changed) this.ClearProxyGraphics();
                  }
          
          '''
          replace(p, '    public partial class Polyline3D\n    {\n', '    public partial class Polyline3D\n    {\n'+method)
          for statement in ['this.vertexes.Insert(index, position);', 'this.vertexes.RemoveAt(index);']:
              replace(p, '{ '+statement+' return; }', '{ '+statement+' this.ClearProxyGraphics(); return; }')
          for line in ['            this.storedVertexRecords.Insert(index, inserted);\n', '            removed.IsRemoved = true;\n']:
              replace(p, line, line+'            this.ClearProxyGraphics();\n')
          replace(p, '            }\n        }\n\n        private DxfDocument ValidateTopologyEdit()', '            }\n            this.ClearProxyGraphics();\n        }\n\n        private DxfDocument ValidateTopologyEdit()')
          replace('tests/netDxf.Conformance/Program.cs', '        RegisterInsertGeometryTests();\n', '        RegisterInsertGeometryTests();\n        RegisterPolyline3DEditTests();\n')
          replace('tests/netDxf.PackageSmoke/Program.cs', 'NetDxf.Qualification.InsertGeometryCases.VerifyInstalled();\n', 'NetDxf.Qualification.InsertGeometryCases.VerifyInstalled();\nNetDxf.Qualification.Polyline3DEditCases.VerifyInstalled();\n')
          for name in ['netDxf.Conformance','netDxf.PackageSmoke','netDxf.TargetSmoke']:
              old='    <Compile Include="../shared/InsertSequenceCases.cs" Link="InsertSequenceCases.cs" />\n'
              replace('tests/'+name+'/'+name+'.csproj', old, old+'    <Compile Include="../shared/Polyline3DEditCases.cs" Link="Polyline3DEditCases.cs" />\n')
          PY
          git add netDxf/Entities/Polyline3D.Topology.cs netDxf/Entities/Polyline3D.cs tests/netDxf.Conformance/Program.cs tests/netDxf.Conformance/netDxf.Conformance.csproj tests/netDxf.PackageSmoke/Program.cs tests/netDxf.PackageSmoke/netDxf.PackageSmoke.csproj tests/netDxf.TargetSmoke/netDxf.TargetSmoke.csproj
          git update-index --force-remove .github/workflows/publish-polyline3d-edits.yml
          test "$(git write-tree)" = 3accc94f70a6ca8aab13ae8076e7f800f635283d
          git reset HEAD -- .github/workflows/publish-polyline3d-edits.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'Integrate explicit Polyline3D editing and complete package regressions'
          git push origin HEAD:refs/heads/codex/dxf-polyline3d-edits-20260925
