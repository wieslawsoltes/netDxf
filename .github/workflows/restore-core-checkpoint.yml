name: Restore reviewed core source checkpoint
on:
  push:
    branches: [codex/recover-core-pipelines-20260924]
    paths: [.github/workflows/restore-core-checkpoint.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify and restore non-workflow source without changing runner permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'be6737295b42b2f9bcd43c50c9c774dfc0b2ef4e'
          test "$(git rev-parse 'HEAD^^{tree}')" = '829d5375a4ddfbc051711df6f3f2ca9a5f0a7961'
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,os
          expected=['de7f6be4f9721bbbaf2a07ebeea370144fefc33b','d4b2add4c279db9974d43e8680175142ad0fb457','5514db8433b4312dddc1a90801f245de2f29d7cf']
          parts=[]
          for i,wanted in enumerate(expected):
              data=Path(f'tools/recover-core-{i}.b64').read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==wanted
              parts.append(data)
          compressed=base64.b64decode(b''.join(parts),validate=True)
          assert len(compressed)==32204 and hashlib.sha256(compressed).hexdigest()=='f44d85f5c46012cdef6ff397c2e86a202782f7e38b3ebd61033065162c838150'
          patch=lzma.decompress(compressed,memlimit=268435456)
          assert len(patch)==138655 and hashlib.sha256(patch).hexdigest()=='b44f74f2ede769e0634458e44edc07fb7d825cfffa2211a556dd242f2e7af30c'
          Path(os.environ['RUNNER_TEMP'],'core-checkpoint.mbox').write_bytes(patch)
          PY
          git config core.autocrlf false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --keep-cr --exclude='.github/workflows/*' "$RUNNER_TEMP/core-checkpoint.mbox"
          test -z "$(git diff HEAD~7 HEAD -- .github/workflows)"
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/recovered-source.index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/recovered-source.index"
          git update-index --force-remove .github/workflows/restore-core-checkpoint.yml tools/recover-core-0.b64 tools/recover-core-1.b64 tools/recover-core-2.b64
          test "$(git write-tree)" = '1afbaeddeb811fda29b084a142cfd0598ce71355'
          unset GIT_INDEX_FILE
          test -z "$(git status --porcelain)"
          git log -7 --format='%H %s'
          git push origin HEAD:refs/heads/codex/recover-core-pipelines-20260924
