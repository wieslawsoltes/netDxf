name: Prepare spline flag correction
on:
  push:
    branches: [fix/dxf-spline-export-flags]
    paths: [.github/workflows/prepare-spline-flags.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-spline-export-flags
          fetch-depth: 0
      - name: Verify and apply exact tested change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 1043b32a3abfaa223e197c4ff1a6795eb6a79039
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          patch = gzip.decompress(Path('.github/spline-flags-transfer.patch.gz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'a805580c07aae1c7ac5cc04e63e89455a0a87a33f0c98af67b97870fb3cd5ca1'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm .github/spline-flags-transfer.patch.gz .github/workflows/prepare-spline-flags.yml
          git add -A
          test "$(git write-tree)" = 0a277261d89723294c0c67aa21256530291ee97f
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: compose SPLINE closure and creation flags as a bit mask'
          git push origin HEAD:fix/dxf-spline-export-flags
