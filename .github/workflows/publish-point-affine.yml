name: Publish reviewed POINT affine source
on:
  push:
    branches: [codex/point-affine-20260923]
    paths: [.github/workflows/publish-point-affine.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact reviewed patch and publish non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a1eef40990128292039e792ae2122c9be45e9582'
          test "$(git rev-parse 'HEAD^^{tree}')" = 'bd32ba4b2507ba14bf47224a33cb804cf213e619'
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,os
          parts=[]
          for i,wanted in enumerate(['2f6a46c2999058c84f280f991e841ec05738d4de','43029c4b6c2d20382a9aa839845160b4c1288e01']):
              b=Path(f'tools/point-affine-{i}.b64').read_bytes()
              assert hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()==wanted
              parts.append(b)
          compressed=base64.b64decode(b''.join(parts),validate=True)
          assert len(compressed)==11488 and hashlib.sha256(compressed).hexdigest()=='31272309c065a9eb220a3c1282f9856e3677c4fd8bb4fb3ef0e9c19e2286fc31'
          patch=lzma.decompress(compressed,memlimit=268435456)
          assert len(patch)==40401 and hashlib.sha256(patch).hexdigest()=='46c3b893125907be64fa364de29d2d173ccfad17287e4f6607f75a1922664e69'
          Path(os.environ['RUNNER_TEMP'],'point-affine.diff').write_bytes(patch)
          PY
          git config core.autocrlf false
          git apply --check "$RUNNER_TEMP/point-affine.diff"
          git apply --index "$RUNNER_TEMP/point-affine.diff"
          # A separate connector commit removes the unchanged transport workflow.
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/point-source.index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/point-source.index"
          git update-index --force-remove .github/workflows/publish-point-affine.yml tools/point-affine-0.b64 tools/point-affine-1.b64
          test "$(git write-tree)" = '460f6645038aa9791fc19cab4c53c20abfac3e9c'
          unset GIT_INDEX_FILE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Transform POINT signed extrusion with staged affine geometry and package regressions'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/codex/point-affine-20260923
