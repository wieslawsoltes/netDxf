name: JavaScript typed document ownership parity
on:
  pull_request:
    branches: [netstandard]
    paths: ['javascript/**', '.github/workflows/javascript-document-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-document-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  document-ownership:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      NETDXF_SOURCE_ROOT: ${{ github.workspace }}/_oracle
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '3496ab91893a1e4ec9261b4833479f1799149cdc'
          path: _oracle
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build the optional Windows replacement host
        if: runner.os == 'Windows'
        working-directory: javascript
        run: npm run build:windows-host
      - run: node javascript/tools/dotnet.mjs geometry
      - run: node javascript/tools/table-content-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/stored-table-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/table-geometry-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/table-style-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/section-manager-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/retained-polyline-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/document-ownership-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/registered-annotations-differential.mjs
      - if: ${{ !cancelled() }}
        run: node --test javascript/tests/unit/document-ownership.js javascript/tests/unit/document-lifecycle.js javascript/tests/unit/registered-annotations.js javascript/tests/unit/retained-polylines.js javascript/tests/unit/section-manager.js javascript/tests/unit/table-styles.js javascript/tests/unit/table-geometry.js javascript/tests/unit/stored-table-content.js
      - if: ${{ !cancelled() }}
        run: node javascript/tests/netDxf.Conformance/Program.js
        env:
          DXF_JS_TEST_ARTIFACTS: javascript/artifacts/document-originals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-document-ownership-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            javascript/artifacts/table-content/${{ matrix.configuration }}/results.json
            javascript/artifacts/stored-table/${{ matrix.configuration }}/results.json
            javascript/artifacts/table-geometry/${{ matrix.configuration }}/results.json
            javascript/artifacts/table-style/${{ matrix.configuration }}/results.json
            javascript/artifacts/section-manager/${{ matrix.configuration }}/results.json
            javascript/artifacts/retained-polyline/${{ matrix.configuration }}/results.json
            javascript/artifacts/document-ownership/${{ matrix.configuration }}/results.json
            javascript/artifacts/registered-annotations/${{ matrix.configuration }}/results.json
            javascript/artifacts/document-originals/*.json
          if-no-files-found: error
          retention-days: 7
