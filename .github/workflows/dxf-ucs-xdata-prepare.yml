name: Prepare UCS XData correction
on:
  push:
    branches: [codex/dxf-ucs-table-xdata]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/dxf-ucs-table-xdata'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dxf-ucs-table-xdata
      - name: Apply the two explicit source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('netDxf/IO/DxfWriter.cs')
          source = path.read_bytes()
          old = b'this.BeginTable(this.doc.UCSs.CodeName, this.doc.UCSs.Handle, (short) this.doc.UCSs.Count, this.doc.Blocks.XData);'
          new = b'this.BeginTable(this.doc.UCSs.CodeName, this.doc.UCSs.Handle, (short) this.doc.UCSs.Count, this.doc.UCSs.XData);'
          assert source.count(old) == 1
          path.write_bytes(source.replace(old, new))
          path = Path('tests/netDxf.Conformance/Program.cs')
          source = path.read_text()
          old = '        RunTextHexTests();'
          assert source.count(old) == 1
          assert 'RunTableXDataTests();' not in source
          path.write_text(source.replace(old, old + '\n        RunTableXDataTests();'))
          PY
          git diff --check
          git rm .github/workflows/dxf-ucs-xdata-prepare.yml
          git add netDxf/IO/DxfWriter.cs tests/netDxf.Conformance/Program.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve UCS table XData instead of copying block metadata'
          git push origin HEAD:refs/heads/codex/dxf-ucs-table-xdata
# Temporary branch-only preparation. It deletes itself before PR creation.
