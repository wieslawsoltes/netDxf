name: Prepare DXF shift
on:
  push:
    branches: [feat/dxf-hatch-gradient-shift]
    paths: [.github/workflows/dxf-prepare-shift.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dxf-hatch-gradient-shift
          fetch-depth: 0
      - name: Apply verified change and remove transfer helper
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b2226fabca6752055c50fa45c7b74f5af464679f HEAD
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git config core.whitespace cr-at-eol
          python - <<'PYCODE'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          encoded = Path('.dxf-shift.part1').read_text().strip() + Path('.dxf-shift.part2').read_text().strip()
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == '288607eff75f6724362468081e0a4c446d5faa65672a1a49ae2fb6f7954f7d0c'
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '5ebe98f33f5e017cc31c988bd38cdd23fa47f7b6d92da1deab8c6ac29c9d4273'
          subprocess.run(['git', 'apply', '--index', '--whitespace=nowarn', '-'], input=patch, check=True)
          PYCODE
          git rm .github/workflows/dxf-prepare-shift.yml .dxf-shift.part1 .dxf-shift.part2
          test "$(git write-tree)" = d84d85946d8876b36b78319f8c79fe9b15145249
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git commit -m 'feat: preserve continuous HATCH gradient shift'
          git push origin HEAD:feat/dxf-hatch-gradient-shift
