name: Prepare tested MESH output validation
on:
  push:
    branches: [fix/dxf-mesh-output-preflight]
    paths: [.github/workflows/dxf-prepare-mesh-output.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-mesh-output-preflight
          fetch-depth: 0
      - name: Verify and apply exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/netstandard)" = 4a60d52c430b346a695c8cdd5ad73f4e00a92800
          python - <<'PY'
          import gzip, hashlib, subprocess
          from pathlib import Path
          packed = b''.join((Path('.github/mesh-transfer') / str(i)).read_bytes() for i in range(4))
          assert hashlib.sha256(packed).hexdigest() == '9968b293a3ca2e738ab45b928f18c51af841ec4a842a0a8102029f3ddd576737'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '4ea840432b359c28f301464c90b34d0f98a6b9ee78682ae9e9767524fccf0c3f'
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm -r .github/mesh-transfer .github/workflows/dxf-prepare-mesh-output.yml
          git add -A
          test "$(git write-tree)" = 1ffb0690927046cef5d1e2b6e352da4e818cc760
          python tools/generate_dxf_coverage.py --check
          python -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: preflight mutable MESH topology and serialized counts'
          git push origin HEAD:fix/dxf-mesh-output-preflight
