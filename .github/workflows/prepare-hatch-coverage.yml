name: Apply checked HATCH coverage checkpoint
on:
  push:
    branches: [docs/dxf-coverage-after-edge-packets]
    paths: [.github/workflows/prepare-hatch-coverage.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/docs/dxf-coverage-after-edge-packets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dxf-coverage-after-edge-packets
      - name: Regenerate and verify the reviewed documentation tree
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          script=Path('.github/patches/refresh-hatch-coverage.py')
          subprocess.run(['python',str(script),'f4c8234494a3088677a366f9575feb05b1a88a0b'],check=True)
          subprocess.run(['python','tools/generate_dxf_coverage.py'],check=True)
          subprocess.run(['python','tools/generate_dxf_coverage.py','--check'],check=True)
          subprocess.run(['python','-m','unittest','discover','-s','tests/dxf_coverage','-p','test_*.py'],check=True)
          script.unlink()
          workflow=Path('.github/workflows/prepare-hatch-coverage.yml');workflow.unlink()
          subprocess.run(['git','add','doc/dxf-conformance/coverage.json','doc/dxf-conformance/version-feature-matrix.md','doc/dxf-conformance/README.md',str(script),str(workflow)],check=True)
          actual=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual=='0509119c252a0409140ed1ede199daeebe970f24',actual
      - name: Commit only the documentation branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'docs: refresh DXF comparison through HATCH edge packet validation'
          git push origin HEAD:docs/dxf-coverage-after-edge-packets
