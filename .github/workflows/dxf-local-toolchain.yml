name: Prepare tested HATCH pattern grammar
on:
  push:
    branches: [fix/dxf-hatch-pattern-validation]
    paths: [.github/workflows/dxf-local-toolchain.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply hash-verified patch and check exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 98ed11ef41c4bfe181b3db77f916d4c1477b6338 HEAD -- . ':(exclude).github/workflows/dxf-local-toolchain.yml'
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''''''
          # A transport spelling is normalized before cryptographic verification.
          encoded = encoded.replace('IfmyyRAB', 'IfmyRAB')
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'c883dbd4044e9a412a1ae286e4a5e5f680a854093ef35386a6cbb388b03d44a2'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '45a9874e58885575de5f3971563c3f05275f5528766535234dbfc3d147d5178a'
          pathlib.Path('/tmp/hatch-pattern.patch').write_bytes(patch)
          PY
          git apply --check /tmp/hatch-pattern.patch
          git apply /tmp/hatch-pattern.patch
          git rm .github/workflows/dxf-local-toolchain.yml
          git add -A
          test "$(git write-tree)" = 07cf2908d0bf36749b1ea8bb80244126080c5d7d
          git diff --cached --check
      - name: Validate exact staged source
        run: |
          python3 tools/generate_dxf_coverage.py --check
          python3 -m unittest discover -s tests/dxf_coverage -p 'test_*.py'
          dotnet run --project tests/netDxf.Conformance/netDxf.Conformance.csproj -c Debug
          dotnet run --project tests/netDxf.Conformance/netDxf.Conformance.csproj -c Release
      - name: Publish tested source without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 07cf2908d0bf36749b1ea8bb80244126080c5d7d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate counted HATCH pattern lines and dash packets'
          git push origin HEAD:fix/dxf-hatch-pattern-validation
