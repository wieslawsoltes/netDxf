name: DXF local test toolchain
on:
  push:
    branches: [fix/dxf-hatch-pattern-validation]
    paths: [.github/workflows/dxf-local-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package explicitly selected .NET 8 compiler
        shell: bash
        run: |
          set -euo pipefail
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk="$(find "$root/sdk" -mindepth 1 -maxdepth 1 -type d -name '8.*' -printf '%f\n' | sort -V | tail -1)"
          mkdir -p out/portable/sdk/"$sdk"
          cp -a "$root/sdk/$sdk/Roslyn" "out/portable/sdk/$sdk/"
          printf 'Explicit compiler SDK: %s\n' "$sdk" > out/compiler-info.txt
          tar -czf out/compiler.tar.gz -C out portable
          sha256sum out/compiler.tar.gz > out/compiler.sha256
          rm -rf out/portable
      - uses: actions/upload-artifact@v4
        with:
          name: dxf-offline-compiler8
          path: out/
          retention-days: 2
