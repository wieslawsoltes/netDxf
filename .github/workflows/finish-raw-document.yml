name: Apply reviewed raw DXF completion
on:
  push:
    branches: [feature/dxf-raw-document]
    paths: [.github/workflows/finish-raw-document.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-raw-document'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-raw-document
      - name: Verify and apply the exact locally tested patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, os, subprocess
          archive = Path('.github/patches/raw-document-completion.gz')
          data = archive.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '358dc0b6d366915393caebb37d6d06151434c636'
          # Repair three known transcription insertions, then verify the complete original patch.
          encoded = base64.b64encode(data).decode()
          for old, new in [('1+8aLrZwX', '1+8aLZwX'), ('wR354a4bbk32', 'wR354a4k32'), ('0nngL3RRW4', '0nngL3RR4')]:
              assert encoded.count(old) == 1
              encoded = encoded.replace(old, new)
          patch_bytes = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch_bytes).hexdigest() == '89db13e1ca741a0e4e6c3395d1c5a8b19cd439b23cfcbb25c984458402f228a4'
          patch = Path(os.environ['RUNNER_TEMP']) / 'raw-document-completion.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          archive.unlink()
          Path('.github/workflows/finish-raw-document.yml').unlink()
          paths = ['doc/dxf-conformance/raw-document.md', 'doc/dxf-conformance/raw-tags.md', 'netDxf/IO/DxfRawDocument.cs', 'netDxf/IO/DxfTag.cs', 'tests/netDxf.Conformance/RawTagTests.cs', 'tests/netDxf.Conformance/RawDocumentBoundaryTests.cs', 'tests/netDxf.Conformance/RegressionTests.cs', 'tools/verify_raw_preservation.py', '.github/patches/raw-document-completion.gz', '.github/workflows/finish-raw-document.yml']
          subprocess.run(['git', 'add', *paths], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'cd58c52a7e46d1f73246a187fc2c637905417eb2'
      - name: Commit only to the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: complete raw DXF preservation and boundary validation'
          git push origin HEAD:feature/dxf-raw-document
