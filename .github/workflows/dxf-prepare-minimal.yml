name: Prepare minimal DXF initialization fix
on:
  push:
    branches: [feature/dxf-minimal-documents]
    paths: [.github/workflows/dxf-prepare-minimal.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-minimal-documents'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked integration edits and remove preparation workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('netDxf/IO/DxfReader.cs')
          s = p.read_text()
          a = s.index('            // check if all table collections has been created\n')
          b = s.index('            // post process complex linetypes\n', a)
          s = s[:a] + '            this.EnsureTableCollections();\n\n' + s[b:]
          for method in ['ReadBlocks', 'ReadEntities', 'ReadObjects']:
              old = '                            this.' + method + '();\n'
              assert s.count(old) == 1
              s = s.replace(old, '                            this.EnsureTableCollections();\n' + old)
          old = '            // perform all necessary post processes\n            this.PostProcesses();'
          new = '''            // Optional sections may be absent in minimal or entity-only exports.
                      // Establish the model-space graph before resolving deferred entities.
                      this.EnsureTableCollections();
                      if (this.doc.Layouts == null)
                      {
                          this.EnsureObjectCollections();
                          this.RelinkOrphanLayouts();
                      }

                      // perform all necessary post processes
                      this.PostProcesses();'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '            this.BuildLayerStateManager();\n'
          assert s.count(old) == 1
          s = s.replace(old, '            this.EnsureObjectCollections();\n\n' + old)
          old = '            // raster variables\n            if (this.doc.RasterVariables == null)\n            {\n                this.doc.RasterVariables = new RasterVariables(this.doc);\n            }\n\n'
          assert s.count(old) == 1
          s = s.replace(old, '')
          old = '            DictionaryObject lsMangerDictionary = this.dictionaries[this.layerStateManagerDictionaryHandle];\n            if (lsMangerDictionary == null)\n'
          new = '            if (!this.dictionaries.TryGetValue(this.layerStateManagerDictionaryHandle, out DictionaryObject lsMangerDictionary))\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '                Debug.Assert(false, string.Format("The block record {0} is not defined.", name));\n'
          assert s.count(old) == 1
          s = s.replace(old, '                // BLOCK_RECORD can be absent with an omitted TABLES section.\n')
          p.write_text(s)
          p = Path('tests/netDxf.Conformance/RegressionTests.cs')
          s = p.read_text()
          old = '        RegisterTextFramingTests();\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + '        RegisterMinimalDocumentTests();\n'))
          expected = {
              'netDxf/IO/DxfReader.cs': 'ae83fd43e99122d8bfbf362bf9e4d56b5302103d0e603e255db17eaf6ec783a8',
              'netDxf/IO/DxfReader.Defaults.cs': '7140c1520faaa871100f39d5914674fa102fdc588116b40c425ba05eee9d763e',
              'tests/netDxf.Conformance/MinimalDocumentTests.cs': '064372e183ab97b31af28e6596015f205a83ec2871361caa41eafe8170dc2cfa',
              'tests/netDxf.Conformance/RegressionTests.cs': 'ff78a046661c4fec7c4b07e274f415b25246f22eeb8abbc8a0700c848093ad03'
          }
          for path, digest in expected.items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Tested-source hash mismatch: ' + path)
          Path('.github/workflows/dxf-prepare-minimal.yml').unlink()
          PY
          git add netDxf/IO/DxfReader.cs tests/netDxf.Conformance/RegressionTests.cs .github/workflows/dxf-prepare-minimal.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: initialize omitted DXF tables and object collections'
          git push origin HEAD:feature/dxf-minimal-documents
