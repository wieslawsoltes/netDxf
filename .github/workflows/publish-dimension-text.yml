name: Publish reviewed dimension text regeneration source
on:
  push:
    branches: [codex/dxf-dimension-text-blocks-20260921]
    paths: [.github/workflows/publish-dimension-text.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed source edits and remove publishing files
        shell: bash
        run: |
          echo "756a54173ec9d3003fe6d2ac5caa04dd43cde3ff2242e9f16868cf4e099f5ac2  tools/_publish_dimension_text.py" | sha256sum --check
          python3 tools/_publish_dimension_text.py
          git add netDxf tests/netDxf.Conformance tools doc/dxf-conformance .github/workflows
          test "$(git write-tree)" = "5704eda679b6c0778f2762d6e4bac9c6f2651f1d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve manual dimension anchors and apply text settings during block regeneration"
          git push origin HEAD:refs/heads/codex/dxf-dimension-text-blocks-20260921
