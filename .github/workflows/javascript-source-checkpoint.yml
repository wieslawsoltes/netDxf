name: JavaScript source checkpoint
on:
  pull_request:
    branches: [netstandard]
    paths: ['javascript/**', '.github/workflows/javascript-source-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Archive exact committed source before qualification
        run: |
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/netdxf-source"
          git rev-parse HEAD > "$RUNNER_TEMP/netdxf-source/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/netdxf-source/source-tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/netdxf-source/source-checkpoint.tar.gz"
          cd "$RUNNER_TEMP/netdxf-source"
          sha256sum source-checkpoint.tar.gz source-commit.txt source-tree.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-source-checkpoint-early
          path: ${{ runner.temp }}/netdxf-source
          if-no-files-found: error
          retention-days: 7
