name: JavaScript dimension and multileader parity
on:
  pull_request:
    branches: [netstandard]
    paths: ['javascript/**', '.github/workflows/javascript-dimensions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-dimensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dimensions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      NETDXF_SOURCE_ROOT: ${{ github.workspace }}/_oracle
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '3496ab91893a1e4ec9261b4833479f1799149cdc'
          path: _oracle
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node javascript/tools/dotnet.mjs geometry
      - run: node javascript/tools/dimension-differential.mjs
      - if: ${{ !cancelled() }}
        run: node javascript/tools/mleader-differential.mjs
      - if: ${{ !cancelled() }}
        run: node --test javascript/tests/unit/dimensions.js javascript/tests/unit/mleaders.js
      - if: ${{ !cancelled() }}
        env:
          DXF_TEST_FILTER: dimstyle-parity/
        run: node javascript/tests/netDxf.Conformance/Program.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-dimensions-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            javascript/artifacts/dimension-differential/${{ matrix.configuration }}/results.json
            javascript/artifacts/mleader-differential/${{ matrix.configuration }}/results.json
            javascript/artifacts/conformance/*.json
          if-no-files-found: error
          retention-days: 7
