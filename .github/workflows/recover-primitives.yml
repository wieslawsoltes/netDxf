name: Recover committed primitive and runtime evidence work
on:
  push:
    branches: [codex/recover-primitives-runtime-20260923]
    paths: [.github/workflows/recover-primitives.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify original checkpoint and replay its three commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '75cc346f98409a298e6559ad6854e39476e01d8f'
          test "$(git rev-parse HEAD^:.)" = 'd14febdc7f9ce6dbbf8caf1beaa6d12ef2d914d2'
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os
          expected = ['c134468bb44113375cb63b7d05d0e090e4511b1d', '09bffd5e43ad2abfbb0940d577727adcbf1ad177', '26369e9147684c084c834f5d8a3fab91b4c86917']
          parts = []
          for i, wanted in enumerate(expected):
              data = Path(f'tools/recovered-primitives-{i}.b64').read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == wanted
              parts.append(data)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert len(compressed) == 18884
          assert hashlib.sha256(compressed).hexdigest() == '386744cdf5a38a621a4d27d0faec46774c5190c43568ca4d91d60aacd97560ef'
          patch = lzma.decompress(compressed, memlimit=268435456)
          assert len(patch) == 78741
          assert hashlib.sha256(patch).hexdigest() == '78c345921697bb197b0502012ba3835871c15b8520bcece01d00793bd2d8aae5'
          Path(os.environ['RUNNER_TEMP'], 'recovered-netdxf.mbox').write_bytes(patch)
          PY
          git config core.autocrlf false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/recover-primitives.yml tools/recovered-primitives-{0,1,2}.b64
          test "$(git write-tree)" = 'd14febdc7f9ce6dbbf8caf1beaa6d12ef2d914d2'
          git commit -m 'Remove verified recovery transport before replaying original source commits'
          git am --keep-cr "$RUNNER_TEMP/recovered-netdxf.mbox"
          test "$(git write-tree)" = 'bd32ba4b2507ba14bf47224a33cb804cf213e619'
          test -z "$(git status --porcelain)"
          git diff --stat 75cc346f98409a298e6559ad6854e39476e01d8f HEAD
          git log -3 --oneline
          git push origin HEAD:refs/heads/codex/recover-primitives-runtime-20260923
