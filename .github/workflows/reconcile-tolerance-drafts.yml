name: Publish reviewed tolerance draft reconciliation
on:
  push:
    branches: [codex/reconcile-tolerance-drafts-20260923]
    paths: [.github/workflows/reconcile-tolerance-drafts.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact reviewed patch and publish non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '66c191e32ae89d95db05bbbbf2d1b762ab923b59'
          test "$(git rev-parse 'HEAD^^{tree}')" = '460f6645038aa9791fc19cab4c53c20abfac3e9c'
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os
          parts = []
          for index, wanted in enumerate(['e3a1d25003a20aaf7122c91bf5bc194f04bd5eee', 'c8416fb7965057548a866c3230a4591282668368']):
              data = Path(f'tools/reconcile-tolerances-{index}.b64').read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == wanted
              parts.append(data)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert len(compressed) == 20420
          assert hashlib.sha256(compressed).hexdigest() == '14c4b225f0cf2ac0994b85e7903bedde64757b63e04c22fceb4f438d7338d7e3'
          patch = lzma.decompress(compressed, memlimit=268435456)
          assert len(patch) == 94976
          assert hashlib.sha256(patch).hexdigest() == '1a09dd7cb4e37434da9879d9611f07ea9f2a0e9d544a1bf21d3b3369177d0a75'
          Path(os.environ['RUNNER_TEMP'], 'reconcile.diff').write_bytes(patch)
          PY
          git config core.autocrlf false
          git apply --check "$RUNNER_TEMP/reconcile.diff"
          git apply --index "$RUNNER_TEMP/reconcile.diff"
          cp "$(git rev-parse --git-path index)" "$RUNNER_TEMP/reconciled-source.index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/reconciled-source.index"
          git update-index --force-remove .github/workflows/reconcile-tolerance-drafts.yml tools/reconcile-tolerances-0.b64 tools/reconcile-tolerances-1.b64
          test "$(git write-tree)" = '5bdcf686de2b090ff55945b02e33ff31cf00a4e8'
          unset GIT_INDEX_FILE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile both tolerance draft suites and preserve reactivated lower bounds'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/codex/reconcile-tolerance-drafts-20260923
