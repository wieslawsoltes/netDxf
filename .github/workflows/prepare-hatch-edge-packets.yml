name: Apply checked HATCH edge packet validation
on:
  push:
    branches: [fix/dxf-hatch-edge-packets]
    paths: [.github/workflows/prepare-hatch-edge-packets.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/fix/dxf-hatch-edge-packets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dxf-hatch-edge-packets
      - name: Apply exact checked source and verify the tested tree
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess
          p=Path('netDxf/IO/DxfReader.cs')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2758355cf7450b0ffd739d34cbe4cd78c2a479c4469035ec91a9fc1b6e7e26f3'
          s=p.read_text()
          a=s.index('        private HatchBoundaryPath ReadEdgeBoundaryPath(int numEdges)')
          b=s.index('        private void ReadHatchSeedPoints(',a)
          snippet=Path('.github/patches/hatch-edge-method.txt')
          p.write_text(s[:a]+snippet.read_text()+s[b:])
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='a4d0bc7c4dfbac1b7846892278d5c9740717ec92b02de0d7e3fd98ec14e978b8'
          p=Path('tests/netDxf.Conformance/RegressionTests.cs');s=p.read_text()
          marker='        RegisterHatchBoundaryFlagsTests();'
          assert s.count(marker)==1
          p.write_text(s.replace(marker,marker+'\n        RegisterHatchEdgeDispatchTests();'))
          # Restore the exact locally verified malformed-coordinate fixture after transfer.
          p=Path('tests/netDxf.Conformance/HatchEdgeDispatchTests.cs');s=p.read_text()
          old='case 2: tags[fit] = new(97, 1); tags.InsertRange(fit + 1, new DxfTag[] { new(11, 0.0), new(21, 0.0) }); break;'
          new=old.replace('new(21, 0.0)','new(22, 0.0)')
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          snippet.unlink()
          workflow=Path('.github/workflows/prepare-hatch-edge-packets.yml');workflow.unlink()
          subprocess.run(['git','add','netDxf/IO/DxfReader.cs','tests/netDxf.Conformance/RegressionTests.cs','tests/netDxf.Conformance/HatchEdgeDispatchTests.cs',str(snippet),str(workflow)],check=True)
          actual=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual=='419077e286efe49fce190b241d6bff92bda94d59',actual
      - name: Commit only the isolated feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: validate HATCH edge packets and reject stalled dispatch'
          git push origin HEAD:fix/dxf-hatch-edge-packets
