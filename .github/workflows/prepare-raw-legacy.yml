name: Apply verified raw R13 R14 profiles
on:
  push:
    branches: [feature/dxf-raw-r13-r14]
    paths: [.github/workflows/prepare-raw-legacy.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'wieslawsoltes/netDxf' && github.ref == 'refs/heads/feature/dxf-raw-r13-r14'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dxf-raw-r13-r14
      - name: Verify patch and pinned data against the complete tested tree
        shell: python
        run: |
          from pathlib import Path
          import gzip, hashlib, json, os, subprocess, urllib.request
          payload = Path('.github/patches/raw-legacy.gz')
          data = payload.read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'a007e76f38d12255db8a3f2972a6fa5da2719e9ae0437494e9fa16ea8ae30c3d'
          patch_bytes = gzip.decompress(data)
          assert hashlib.sha256(patch_bytes).hexdigest() == 'f54d72d800308a8987a2b7361956fcd55437a9fe18c2871e5a31a1c608a32dba'
          patch = Path(os.environ['RUNNER_TEMP']) / 'raw-legacy.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          root = Path('tests/fixtures/legacy')
          for row in json.loads((root / 'provenance.json').read_text())['files']:
              assert row['source'].startswith('https://raw.githubusercontent.com/mozman/ezdxf/d6f2ac10caeddc712ed1824aaeb3b9c050de4a04/')
              with urllib.request.urlopen(row['source'], timeout=45) as response:
                  data = response.read(2 * 1024 * 1024 + 1)
              assert len(data) <= 2 * 1024 * 1024
              assert hashlib.sha256(data).hexdigest() == row['sha256']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == row['git_blob']
              assert Path(row['file']).name == row['file']
              (root / row['file']).write_bytes(data)
          payload.unlink()
          Path('.github/workflows/prepare-raw-legacy.yml').unlink()
          paths = ['doc/dxf-conformance/raw-r13-r14.md', 'netDxf/IO/DxfRawDocument.cs', 'tests/fixtures/legacy', 'tests/netDxf.Conformance/RawLegacyProfileTests.cs', 'tests/netDxf.Conformance/RegressionTests.cs', 'tools/verify_legacy_raw_profiles.py', '.github/patches/raw-legacy.gz', '.github/workflows/prepare-raw-legacy.yml']
          subprocess.run(['git', 'add', *paths], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'c2d3e93ff7fa877edcdd66e65f486c4dd394539e'
      - name: Commit only the feature branch
        run: |
          git config user.name 'DXF conformance automation'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: preserve R13 and R14 raw DXF profiles with historical code pages'
          git push origin HEAD:feature/dxf-raw-r13-r14
