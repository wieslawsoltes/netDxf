<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>netDxf · Shadow CAD Studio</title>
  <link rel="stylesheet" href="cad/cad.css"><link rel="stylesheet" href="cad/workspace-shell.css"><script type="module" src="cad/app.mjs"></script>
</head>
<body>
  <div id="studio">
    <header class="titlebar">
      <button class="app-menu" id="file-menu" title="Drawing menu" aria-label="Drawing menu" aria-haspopup="dialog" aria-expanded="false">S<span>▾</span></button>
      <div id="quick-access" class="quick-access" aria-label="Quick access"></div>
      <button id="workspace-switch" class="workspace-switch" title="Switch workspace" aria-label="Switch workspace" aria-haspopup="menu" aria-expanded="false" data-shell-icon="workspace"><span id="workspace-name">Drafting &amp; Annotation</span><span aria-hidden="true">▾</span></button>
      <span id="title">Drawing — netDxf Shadow Studio</span>
      <button data-action="command-search" class="title-search" title="Search commands (Ctrl+K)" aria-label="Search commands" data-shell-icon="search"><span>Search commands</span><kbd>Ctrl K</kbd></button>
      <span class="local-badge" title="All drawing operations use your local netDxf host">LOCAL CAD</span>
      <button data-action="help" class="help-button" title="Command help (F1)" aria-label="Command help" data-shell-icon="help"></button>
    </header>
    <div class="ribbon-bar"><nav id="ribbon-tabs" class="ribbon-tabs" role="tablist" aria-label="Ribbon"></nav><button id="ribbon-toggle" data-action="ribbon-cycle" aria-label="Cycle ribbon display" aria-controls="ribbon" title="Cycle ribbon display">⌃</button><button id="ribbon-display" data-action="ribbon-display" aria-label="Ribbon display options" aria-haspopup="menu" title="Ribbon display options">▾</button></div>
    <section id="ribbon" class="ribbon" role="tabpanel" aria-label="Home tools"></section>
    <div class="document-bar"><button id="drawing-list" class="shell-icon-button" title="Open drawings" aria-label="Open drawings menu" aria-haspopup="menu" data-shell-icon="menu"></button><div id="documents" role="tablist" aria-label="Open drawings"></div><button data-action="new" class="shell-icon-button" title="New drawing (Ctrl+N)" aria-label="New drawing" data-shell-icon="plus"></button><div class="grow"></div><button data-action="ui-workspaces" class="document-workspaces" title="Save and restore UI layouts" aria-label="Manage UI workspaces" data-shell-icon="workspace"><span>UI workspaces</span></button><button data-action="palette-picker" title="Open drawing palettes" aria-haspopup="menu" data-shell-icon="window"><span>Palettes</span></button><button data-action="palette" class="shell-icon-button" title="Show or hide palettes (Ctrl+1)" aria-label="Show or hide palettes" data-shell-icon="window"></button><button data-action="clean" class="shell-icon-button" title="Clean screen (Ctrl+0)" aria-label="Clean screen" data-shell-icon="clean"></button></div>
    <main id="workspace" class="workspace">
      <section id="drawing-area" class="drawing-area" aria-label="Drawing and command workspace">
      <div id="viewport" class="viewport" tabindex="0" aria-label="Drawing viewport. Click to select; middle-drag to pan; wheel to zoom.">
        <canvas id="drawing" aria-label="CAD drawing canvas"></canvas>
        <div class="viewport-heading"><button data-action="fit" title="Zoom extents" aria-label="Zoom extents">[+]</button><span>[Top]</span><span>[2D Wireframe]</span></div>
        <div class="view-compass" aria-label="World view"><span>N</span><button data-action="fit" title="Top view / zoom extents">TOP</button><span>WCS</span></div>
        <div class="navigation-bar" aria-label="View navigation"><button data-action="pan" title="Pan" aria-label="Pan" data-shell-icon="pan"></button><button data-action="zoom-in" title="Zoom in" aria-label="Zoom in" data-shell-icon="plus"></button><button data-action="zoom-out" title="Zoom out" aria-label="Zoom out" data-shell-icon="minus"></button><button data-action="fit" title="Zoom extents" aria-label="Zoom extents" data-shell-icon="clean"></button></div>
        <div class="ucs" aria-hidden="true"><span class="axis-y">Y</span><span class="axis-x">X</span><b>□</b></div>
        <div id="dynamic-input" class="dynamic-input" hidden></div>
        <div id="view-notice" class="view-notice" hidden></div>
        <div id="loading" class="loading" role="status">Connecting to local CAD services…</div>
      </div>
      <div id="command-splitter" class="command-splitter" role="separator" tabindex="0" aria-label="Resize command history" aria-orientation="horizontal" aria-valuemin="32" aria-valuemax="600" aria-valuenow="90"></div>
      <section id="command-line" class="command-line" aria-label="Command line">
        <div id="history" class="command-history" role="log" aria-live="polite"></div>
        <form id="command-form" autocomplete="off"><button type="button" id="command-grip" class="command-grip" title="Move command line" aria-label="Move command line" data-shell-icon="grip"></button><button type="button" data-action="command-line" class="command-close" title="Hide command line (Ctrl+9)" aria-label="Hide command line" data-shell-icon="close"></button><button type="button" data-action="command-history" id="command-history-toggle" title="Show or hide command history (F2)" aria-label="Show or hide command history" aria-controls="history" aria-expanded="true">⌃</button><span class="command-glyph">›</span><label id="prompt" for="command-input">Command:</label><input id="command-input" aria-label="Command input" placeholder="Type a command" spellcheck="false" autocomplete="off"><button type="button" id="command-dock-toggle" title="Float command line" aria-label="Float command line" data-shell-icon="float"></button><button type="submit" title="Submit command" aria-label="Submit command">↵</button></form>
        <div id="suggestions" class="suggestions" hidden></div><button id="command-resize" class="command-resize" aria-label="Resize floating command line" title="Resize command line · arrow keys · Shift for fine adjustment" data-shell-icon="resize" hidden></button>
      </section>
      <div class="layout-bar"><button id="layout-list" title="Model and paper layouts" aria-label="Drawing layouts menu" aria-haspopup="menu" data-shell-icon="layout"></button><div id="layouts" role="tablist" aria-label="Model and paper layouts"></div><div class="grow"></div><span id="selection-count">No selection</span></div>
      </section>
      <div id="palette-splitter" class="palette-splitter" role="separator" tabindex="0" aria-label="Resize palettes" aria-orientation="vertical"></div>
      <aside id="palette" class="palette" aria-label="Drawing palettes">
        <header class="palette-title"><strong id="palette-title">PROPERTIES</strong><div class="grow"></div><button data-action="dock" title="Dock palette left or right">⇆</button><button data-action="palette" title="Close palette">×</button></header>
        <div id="palette-tabs" class="palette-tabs" role="tablist" aria-label="Palettes"></div>
        <div id="palette-content" class="palette-content" role="tabpanel"></div>
      </aside>
    </main>
    <footer class="statusbar"><span id="coordinates" title="Drawing coordinates">0.0000, 0.0000, 0.0000</span><span id="revision">Revision —</span><div class="grow"></div><button id="space-mode" title="Current drawing space" aria-label="Current drawing space" aria-haspopup="menu">MODEL</button><div id="drafting-modes" aria-label="Drafting aids"></div><button id="command-line-toggle" data-action="command-line" aria-label="Show or hide command line" aria-controls="command-line" aria-pressed="true" title="Command line (Ctrl+9)" data-shell-icon="command"></button><select id="backend" aria-label="Render backend"><option value="skia">SkiaSharp</option><option value="svg">SVG</option></select><button data-action="settings" title="Drafting settings" aria-label="Drafting settings" data-shell-icon="settings"></button><button id="status-workspaces" title="Switch workspace" aria-label="Status workspace switcher" aria-haspopup="menu" data-shell-icon="workspace"></button><span id="connection" role="status">Connecting</span><button id="status-customize" title="Customize status bar" aria-label="Customize status bar" aria-haspopup="menu" data-shell-icon="menu"></button></footer>
  </div>
  <input type="file" id="open-file" accept=".dxf,.dwg" hidden><input type="file" id="font-file" accept=".shx,.shp" hidden>
  <dialog id="dialog"><form method="dialog" id="dialog-form"><header><strong id="dialog-title"></strong><button value="cancel" formnovalidate aria-label="Close dialog">×</button></header><div id="dialog-body"></div><footer><button value="cancel" formnovalidate>Cancel</button><button id="dialog-submit" value="ok" class="primary">OK</button></footer></form></dialog>
  <div id="context-menu" class="context-menu" hidden></div><div id="toast" class="toast" role="alert" hidden></div>
  <noscript>Shadow CAD Studio requires JavaScript and its local ASP.NET host.</noscript>
</body>
</html>
